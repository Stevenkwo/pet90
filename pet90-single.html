<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PET 90 · 阅读 + 口语 + 单词射击</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* PET 90 — playful "language-app" look: white ground, candy colours, chunky 3D buttons, rounded type */
:root{
  --bg:#ffffff; --bg-2:#f7f7f7; --line:#e5e5e5; --line-2:#d0d0d0; --text:#3c3c3c; --text-2:#6f6f6f; --muted:#a6a6a6;
  --green:#58cc02; --green-d:#46a302; --green-l:#d7ffb8; --green-xl:#f0ffe3;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#ddf4ff; --blue-xl:#eefaff;
  --yellow:#ffc800; --yellow-d:#e5a500; --yellow-l:#fff4c2; --yellow-xl:#fffbe6;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-l:#ffdfe0; --red-xl:#fff1f1;
  --purple:#ce82ff; --purple-d:#a560eb; --purple-l:#f1e3ff; --purple-xl:#f9f3ff;
  --orange:#ff9600; --orange-d:#e58600; --orange-l:#ffe1b8; --orange-xl:#fff4e3;
  --teal:#2fd1c6; --teal-d:#22b3a9; --teal-l:#d6f7f4; --pink:#ff86d0;
  --teal:#00c2b8; --teal-d:#00a09a; --teal-l:#d0f7f4; --teal-xl:#effcfb;
  --read:var(--blue); --read-d:var(--blue-d); --read-soft:var(--blue-l);
  --listen:var(--teal); --listen-d:var(--teal-d); --listen-soft:var(--teal-l);
  --speak:var(--orange); --speak-d:var(--orange-d); --speak-soft:var(--orange-l);
  --vocab:var(--purple); --vocab-d:var(--purple-d); --vocab-soft:var(--purple-l);
  --shoot:var(--green); --shoot-d:var(--green-d); --shoot-soft:var(--green-l);
  --mock:var(--red); --mock-soft:var(--red-l); --accent:var(--yellow); --accent-2:var(--yellow-d);
  --ok:var(--green); --ok-soft:var(--green-l); --bad:var(--red); --bad-soft:var(--red-l); --warn:var(--orange); --warn-soft:var(--orange-l);
  --ink:var(--text); --ink-2:var(--text-2); --navy:#1cb0f6; --cream:#fff; --paper:#fff; --paper-2:var(--bg-2); --card:#fff;
  --radius:20px; --shadow:0 2px 0 rgba(0,0,0,.02);
  --ui:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif; --display:'Fredoka','Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; --serif:'Nunito','PingFang SC',sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--text);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(520px 320px at 92% 6%,rgba(255,200,0,.14),transparent 70%),
 radial-gradient(560px 360px at 4% 96%,rgba(28,176,246,.12),transparent 70%),
 radial-gradient(420px 300px at 70% 90%,rgba(206,130,255,.10),transparent 70%)}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;position:relative;z-index:1}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;color:var(--text)}
h1{font-size:32px} h2{font-size:22px} h3{font-size:18px}
p{margin:.4em 0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
::selection{background:var(--yellow-l)}
/* ---------- sidebar */
#sidebar{background:#fff;border-right:2px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.brand-mark{width:52px;height:52px;flex:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:26px;color:var(--green);letter-spacing:.02em;line-height:1} .brand-sub{font-size:12px;color:var(--text-2);font-weight:700;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:14px;padding:9px 14px;border-radius:14px;text-decoration:none;font-weight:800;font-size:15px;color:var(--text-2);border:2px solid transparent;transition:.12s;letter-spacing:.03em}
.nav-item:hover{background:var(--bg-2)}
.nav-item.active{background:var(--blue-l);border-color:#84d8ff;color:var(--blue-d)}
.nav-icon{width:32px;height:32px;display:grid;place-items:center;font-size:22px;border-radius:10px}
.xpbox{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.streak-card{display:flex;align-items:center;gap:10px;background:var(--orange-xl);border:2px solid var(--orange-l);border-radius:16px;padding:10px 12px}
.streak-card .fire{font-size:28px} .streak-card b{font-family:var(--display);font-size:22px;color:var(--orange-d);display:block;line-height:1} .streak-card span{font-size:12px;color:var(--text-2);font-weight:800}
.xp-card{background:var(--green-xl);border:2px solid var(--green-l);border-radius:16px;padding:10px 12px}
.xp-top{display:flex;justify-content:space-between;font-weight:900;font-size:13px;color:var(--green-d)} .xp-lv{font-family:var(--display);font-size:15px}
.xp-title{color:var(--text-2);font-size:12px;font-weight:800;margin:2px 0 6px}
.xp-bar{height:12px;background:#fff;border:2px solid var(--green-l);border-radius:99px;overflow:hidden} .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be15d);border-radius:99px;transition:width .5s;background-size:24px 24px;background-image:linear-gradient(135deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:24px 0}}
.xp-meta{margin-top:6px;font-size:12px;color:var(--text-2);font-weight:800}
/* ---------- main */
#main{padding:30px 40px 90px;max-width:1120px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.page-head .sub{color:var(--text-2);margin:6px 0 0;font-size:15px;font-weight:600}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
.card.tight{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;align-items:center} .gap{gap:10px} .wrap{flex-wrap:wrap} .between{justify-content:space-between} .center{justify-content:center}
.muted{color:var(--text-2)} .small{font-size:13px} .tiny{font-size:12px} .bold{font-weight:900} .lead{font-size:17px}
.mt{margin-top:14px} .mb{margin-bottom:14px} .mt2{margin-top:24px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;background:var(--bg-2);color:var(--text-2);letter-spacing:.03em}
.pill.read{background:var(--blue-l);color:var(--blue-d)} .pill.listen{background:var(--teal-l);color:var(--teal-d)} .pill.speak{background:var(--orange-l);color:var(--orange-d)} .pill.vocab{background:var(--purple-l);color:var(--purple-d)} .pill.shoot{background:var(--green-l);color:var(--green-d)} .pill.mock{background:var(--red-l);color:var(--red-d)} .pill.ok{background:var(--green-l);color:var(--green-d)} .pill.bad{background:var(--red-l);color:var(--red-d)} .pill.warn{background:var(--orange-l);color:var(--orange-d)} .pill.accent{background:var(--yellow-l);color:#9a6700}
/* ---------- chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:16px;border:2px solid var(--line-2);border-bottom-width:4px;background:#fff;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;color:var(--text-2);transition:.08s;text-decoration:none;user-select:none}
.btn:hover{filter:brightness(1.03)} .btn:active{transform:translateY(2px);border-bottom-width:2px} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--green);border-color:var(--green-d);color:#fff} .btn-accent{background:var(--yellow);border-color:var(--yellow-d);color:#5a3d00}
.btn-read{background:var(--blue);border-color:var(--blue-d);color:#fff} .btn-listen{background:var(--teal);border-color:var(--teal-d);color:#fff} .btn-speak{background:var(--orange);border-color:var(--orange-d);color:#fff} .btn-vocab{background:var(--purple);border-color:var(--purple-d);color:#fff} .btn-shoot{background:var(--green);border-color:var(--green-d);color:#fff}
.btn-lg{padding:15px 28px;font-size:19px;border-radius:18px} .btn-sm{padding:7px 14px;font-size:14px;border-radius:12px;border-bottom-width:3px} .btn-ghost{background:transparent;border-color:transparent;color:var(--blue)} .btn-ghost:hover{background:var(--blue-xl)}
.icon-btn{border:0;background:transparent;font-size:18px;padding:6px 10px;border-radius:10px} .icon-btn:hover{background:var(--bg-2)}
/* ---------- mascot */
.mascot{width:96px;height:96px;display:block;animation:bob 3s ease-in-out infinite} .mascot.cheer{animation:wiggle 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
.mascot-say{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;color:var(--text);font-size:15px}
.mascot-say::before{content:"";position:absolute;left:-12px;top:22px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.mascot-row{display:flex;align-items:center;gap:18px}
/* ---------- today */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:stretch}
.hero-day{background:linear-gradient(135deg,var(--green),#7ee03b);color:#fff;border-radius:24px;padding:26px 28px;position:relative;overflow:hidden;border:2px solid var(--green-d);border-bottom-width:6px}
.hero-day::after{content:"";position:absolute;right:-30px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-day .k{font-size:13px;opacity:.92;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.hero-day .d{font-family:var(--display);font-size:52px;font-weight:700;line-height:1.05;margin:6px 0} .hero-day .d small{font-size:20px;opacity:.85;font-weight:600}
.hero-day .ph{display:inline-block;margin-top:8px;background:#fff;color:var(--green-d);padding:5px 14px;border-radius:99px;font-weight:900;font-size:13px}
.ring{--p:0;width:124px;height:124px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.28) 0);display:grid;place-items:center;position:absolute;right:26px;top:26px;z-index:1}
.ring::before{content:"";width:96px;height:96px;border-radius:50%;background:var(--green)} .ring b{position:absolute;font-family:var(--display);font-size:24px;font-weight:700}
.hero-side{display:flex;flex-direction:column;gap:12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px} .stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1} .stat .k{color:var(--text-2);font-size:13px;font-weight:800}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tasks{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:16px;padding:14px 18px;background:#fff;border:2px solid var(--line);border-radius:20px;transition:.12s}
.task:hover{border-color:var(--line-2);transform:translateX(3px)} .task.done{background:var(--green-xl);border-color:var(--green-l)}
.task .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none;border-bottom:4px solid rgba(0,0,0,.12)}
.task .ic.reading{background:var(--blue-l)} .task .ic.speaking{background:var(--orange-l)} .task .ic.vocab{background:var(--purple-l)} .task .ic.shoot{background:var(--green-l)} .task .ic.lesson{background:var(--yellow-l)} .task .ic.mock{background:var(--red-l)} .task .ic.review{background:var(--teal-l)}
.task .t{flex:1} .task .t b{font-size:17px;font-weight:900} .task .t .m{color:var(--text-2);font-size:13px;font-weight:700}
.task .chk{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px} .task.done .chk{background:var(--green);border-color:var(--green-d);animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.daynav{display:flex;gap:8px;align-items:center}
.alldone{background:var(--yellow-xl);border:2px solid var(--yellow-l);border-radius:20px;padding:18px 22px;display:flex;align-items:center;gap:16px}
/* ---------- plan path */
.units{display:flex;flex-direction:column;gap:6px}
.unit-banner{border-radius:20px;padding:16px 22px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px;border-bottom:5px solid rgba(0,0,0,.18)}
.unit-banner h3{color:#fff;font-size:20px} .unit-banner .sub{opacity:.95;font-size:13px;font-weight:800;margin-top:2px}
.unit-banner.phase-基础{background:var(--green)} .unit-banner.phase-提升{background:var(--blue)} .unit-banner.phase-冲刺{background:var(--purple)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 10px}
.node{position:relative;transform:translateX(var(--x,0));display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.node-btn{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:#fff;background:var(--line);border-bottom:8px solid rgba(0,0,0,.15);transition:.1s}
.node:hover .node-btn{transform:translateY(-2px)} .node:active .node-btn{transform:translateY(3px);border-bottom-width:4px}
.node.future .node-btn{background:#e5e5e5;color:#afafaf}
.node.part .node-btn{background:var(--orange)} .node.done .node-btn{background:var(--yellow);color:#5a3d00;font-size:30px}
.node.today .node-btn{background:var(--p-color,var(--green));box-shadow:0 0 0 6px #fff,0 0 0 10px var(--p-color,var(--green))}
.node.today.done .node-btn{background:var(--yellow)}
.node-date{font-size:12px;font-weight:800;color:var(--text-2)} .node.today .node-date{color:var(--text)}
.node-tip{position:absolute;top:-46px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-family:var(--display);font-weight:700;color:var(--green-d);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node .mini{position:absolute;right:-6px;top:-4px;background:#fff;border:2px solid var(--line);border-radius:99px;font-size:11px;font-weight:900;padding:1px 7px;color:var(--text-2)}
/* ---------- choosers */
.part-card{cursor:pointer;transition:.12s;border-top:6px solid var(--read)} .part-card:hover{transform:translateY(-3px);border-color:var(--line-2);border-top-color:var(--read)} .part-card.speak{border-top-color:var(--speak)} .part-card.speak:hover{border-top-color:var(--speak)}
.part-card h3{font-size:19px} .part-card .desc{color:var(--text-2);font-size:13px;margin:6px 0 12px;font-weight:700}
.set-list{display:flex;flex-direction:column;gap:10px}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border:2px solid var(--line);border-radius:16px;cursor:pointer;transition:.12s} .set-row:hover{border-color:var(--line-2);transform:translateX(3px)}
.set-row .t{flex:1;font-weight:800} .score{font-weight:900;font-family:var(--display)} .score.good{color:var(--green-d)} .score.mid{color:var(--orange-d)} .score.bad{color:var(--red-d)}
/* ---------- reading runner */
.runner-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;position:sticky;top:0;background:#fff;padding:12px 0;z-index:5;border-bottom:2px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:700;font-size:20px;background:#fff;border:2px solid var(--line);padding:6px 14px;border-radius:14px} .timer.over{color:var(--red);border-color:var(--red-l);background:var(--red-xl)} .timer.big{font-size:26px}
.instr{background:var(--yellow-xl);border:2px solid var(--yellow-l);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:600}
.instr b{font-weight:900}
.passage{font-family:var(--serif);font-size:17.5px;line-height:1.8;color:var(--text);font-weight:600}
.passage p{margin:0 0 1em}
.passage h2{font-weight:700;font-size:24px;margin-bottom:12px;color:var(--blue-d)}
.two-col{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start} .two-col .sticky{position:sticky;top:76px}
.q{margin-bottom:16px;padding:16px 18px;background:#fff;border:2px solid var(--line);border-radius:18px}
.q .qt{font-weight:900;margin-bottom:10px;font-size:16px} .q .qn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;margin-right:8px;font-weight:900}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;margin-bottom:8px;cursor:pointer;background:#fff;transition:.1s;font-size:16px;font-weight:600}
.opt:hover{border-color:var(--line-2)} .opt:active{transform:translateY(2px);border-bottom-width:2px} .opt.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
.opt .l{font-weight:900;width:24px;flex:none;color:var(--text-2)}
.opt.correct{border-color:#a5ed6e;background:var(--green-l);color:var(--green-d)} .opt.wrong{border-color:#ffb3b3;background:var(--red-l);color:var(--red-d)}
.why{margin-top:10px;padding:10px 14px;border-left:5px solid var(--yellow);background:var(--yellow-xl);border-radius:10px;font-size:14px;color:var(--text);font-weight:600}
.rw{font-size:16px;line-height:1.6;margin-bottom:12px;padding:16px 20px;border-radius:16px;position:relative;font-weight:600}
.rw-head{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:8px}
.rw.sign{background:#fff;border:3px solid var(--text);border-radius:10px;text-align:center;font-weight:800;letter-spacing:.01em}
.rw.notice{background:#fff;border:2px solid var(--line-2);box-shadow:0 3px 0 var(--line-2)} .rw.notice::before{content:"📌";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:18px}
.rw.message{background:var(--green-l);border-radius:22px 22px 22px 6px;border:2px solid #b9ef8e}
.rw.email{background:#fff;border:2px solid var(--line-2)} .rw.email .rw-head{border-bottom:2px solid var(--line);padding-bottom:6px}
.rw.note{background:#fff59d;transform:rotate(-.6deg);box-shadow:3px 4px 0 rgba(0,0,0,.08)}
.gap-sel{display:inline-block;margin:0 3px;padding:3px 10px;border:2px solid var(--blue);border-radius:10px;font-weight:900;background:#fff;min-width:60px;vertical-align:baseline;color:var(--blue-d)}
.gap-in{display:inline-block;width:110px;margin:0 3px;padding:4px 8px;border:2px solid var(--line-2);border-radius:10px;background:#fff;font-size:16px;text-align:center;vertical-align:baseline;font-weight:700}
.gap-in:focus{outline:none;border-color:var(--blue);background:var(--blue-xl)} .gap-in.correct,.gap-sel.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)} .gap-in.wrong,.gap-sel.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.gapnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--yellow);color:#5a3d00;font-weight:900;font-size:12px;margin:0 4px;vertical-align:middle}
.sent-list{list-style:none;padding:0;margin:0} .sent-list li{padding:9px 12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:15.5px;background:#fff;font-weight:600} .sent-list li b{margin-right:8px;color:var(--blue-d)}
.sent-list li.used{opacity:.4}
.people{display:flex;flex-direction:column;gap:10px} .person{padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:#fff} .person .nm{font-weight:900;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px} .person p{font-size:15.5px;margin:0;font-weight:600}
.texts{display:flex;flex-direction:column;gap:8px} .txt{padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:15px;font-weight:600} .txt b{display:block;margin-bottom:2px;font-weight:900}
.txt .letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;margin-right:6px}
.result-box{padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--blue),#5cc9ff);color:#fff;display:flex;align-items:center;gap:22px;margin-bottom:18px;border:2px solid var(--blue-d);border-bottom-width:6px}

.transcript{min-height:64px;padding:12px 16px;background:var(--bg-2);border:2px dashed var(--line-2);border-radius:14px;font-size:16px;color:var(--text);font-weight:600} .transcript .interim{color:var(--muted)}
.fb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0} .fb .stat{padding:12px} .fb .stat .v{font-size:22px}
.notes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px} .notes li{padding:9px 12px;border-radius:12px;background:var(--bg-2);font-size:14px;font-weight:700} .notes li.ok{background:var(--green-l);color:var(--green-d)} .notes li.warn{background:var(--orange-l);color:var(--orange-d)} .notes li.tip{background:var(--blue-l);color:var(--blue-d)}
.stars{display:flex;gap:6px} .stars button{border:0;background:transparent;font-size:26px;padding:0;opacity:.3;transition:.1s} .stars button.on{opacity:1;transform:scale(1.15)}
.photo{width:100%;max-height:520px;object-fit:cover;border-radius:18px;border:2px solid var(--line);background:var(--bg-2)}
.photo-wrap{position:relative} .photo-credit{position:absolute;right:10px;bottom:10px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:99px} .photo-credit a{color:#fff}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:8px} .guide div{padding:8px 12px;background:var(--yellow-xl);border:2px solid var(--yellow-l);border-radius:12px;font-size:14px;font-weight:700} .guide div b{margin-right:6px}
.options-strip{display:flex;gap:10px;flex-wrap:wrap} .opt-card{flex:1;min-width:120px;padding:14px 10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:#fff;text-align:center} .opt-card .e{font-size:36px} .opt-card .l{font-weight:900;font-size:14px;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chip{padding:5px 12px;border-radius:99px;background:var(--bg-2);font-size:13px;font-weight:800} .chip.hit{background:var(--green-l);color:var(--green-d)} .chip.miss{background:var(--bg-2);color:var(--muted)}
.dialogue{display:flex;flex-direction:column;gap:12px}
/* ---------- vocab cards */
.flash{perspective:1200px;height:300px;cursor:pointer} .flash-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d} .flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;border:2px solid var(--line);border-bottom-width:6px}
.face.front{background:linear-gradient(160deg,#fff,var(--yellow-xl))} .face.back{background:linear-gradient(160deg,#fff,var(--purple-l));transform:rotateY(180deg)}
.face .w{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.01em} .face .pos{color:var(--text-2);font-weight:800} .face .zh{font-size:32px;font-weight:900;color:var(--purple-d)} .face .ex{font-size:17px;color:var(--text);font-weight:600}
.dots-progress{display:flex;gap:4px;justify-content:center;margin:12px 0} .dots-progress i{width:16px;height:8px;border-radius:4px;background:var(--line)} .dots-progress i.ok{background:var(--green)} .dots-progress i.no{background:var(--red)} .dots-progress i.cur{background:var(--blue)}
/* ---------- shooter */

.arena .overlay h2{font-size:38px;color:#ffd166} .arena .overlay .btn{border-color:transparent;border-bottom-color:rgba(0,0,0,.25)}
.speedbar{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 14px;margin:12px 0}
.speedbar input[type=range]{flex:1;accent-color:var(--green);height:6px}
.speedbar .val{font-family:var(--display);font-weight:700;min-width:52px;text-align:center;color:var(--green-d);font-size:18px}
.speedbar .btn-sm{padding:4px 12px}
.groups{display:grid;grid-template-columns:repeat(11,1fr);gap:8px} .gbtn{padding:12px 6px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;font-family:var(--display);font-weight:700;font-size:18px;cursor:pointer;transition:.1s;text-align:center;color:var(--text)} .gbtn:hover{border-color:var(--line-2)} .gbtn:active{transform:translateY(2px);border-bottom-width:2px} .gbtn.sel{background:var(--green);color:#fff;border-color:var(--green-d)} .gbtn small{display:block;font-size:11px;color:var(--text-2);font-weight:800;font-family:var(--ui)} .gbtn.sel small{color:#eaffd6}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff} .seg button{border:0;background:#fff;padding:8px 14px;font-weight:900;color:var(--text-2)} .seg button.on{background:var(--blue);color:#fff}
.missed{display:flex;flex-wrap:wrap;gap:6px} .missed span{padding:6px 10px;background:var(--red-l);color:var(--red-d);border-radius:10px;font-weight:800;font-size:14px}
/* ---------- charts */
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding:10px 6px 0;border-bottom:2px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar i{width:100%;max-width:56px;border-radius:8px 8px 0 0;background:var(--blue);min-height:3px;transition:height .5s}
.bar b{font-size:12px;margin-bottom:6px} .bar span{position:absolute;bottom:-22px;font-size:12px;color:var(--text-2);font-weight:800;white-space:nowrap}
.bars.shoot .bar i{background:var(--green)} .bars .bar.empty i{background:var(--line)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:4px} .strip i{aspect-ratio:1;border-radius:5px;background:var(--line)} .strip i.l1{background:var(--yellow-l)} .strip i.l2{background:#a5ed6e} .strip i.l3{background:var(--green)} .strip i.today{outline:3px solid var(--blue)}
.tbl{width:100%;border-collapse:collapse;font-size:14px} .tbl th,.tbl td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top} .tbl th{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:900}
.lesson-body h2{font-size:19px;margin:24px 0 8px;padding-left:12px;border-left:5px solid var(--yellow)} .lesson-body p,.lesson-body li{font-size:15.5px;line-height:1.75;font-weight:600} .lesson-body .tbl{margin:8px 0 12px} .lesson-body i{color:var(--blue-d);font-style:normal;font-weight:800}
.lesson-list .set-row .t small{display:block;color:var(--text-2);font-weight:700}
/* ---------- modal, toast, confetti */
.modal-back{position:fixed;inset:0;background:rgba(60,60,60,.45);display:grid;place-items:center;z-index:50;opacity:0;transition:.2s;padding:20px} .modal-back.show{opacity:1}
.modal-box{background:#fff;border-radius:26px;width:min(600px,100%);max-height:90vh;overflow:auto;border:2px solid var(--line);transform:translateY(10px);transition:.2s} .modal-back.show .modal-box{transform:none} .modal-box.wide{width:min(900px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0} .modal-body{padding:18px 24px 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px} .field label{font-weight:900;font-size:13px;color:var(--text-2);letter-spacing:.03em} .field input,.field select,.field textarea{padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700} .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
#toast-root{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--text);color:#fff;padding:11px 18px;border-radius:16px;font-weight:900;opacity:0;transform:translateY(8px);transition:.3s;border-bottom:4px solid rgba(0,0,0,.25)} .toast.show{opacity:1;transform:none} .toast.xp{background:var(--purple)} .toast.level{background:var(--yellow);color:#5a3d00} .toast.bad{background:var(--red)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden} .confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.empty{padding:40px;text-align:center;color:var(--text-2);font-weight:700}
kbd{font-family:var(--ui);font-size:12px;padding:2px 7px;border:2px solid var(--line);border-bottom-width:3px;border-radius:8px;background:#fff;font-weight:900}
@media (max-width:1000px){#app{grid-template-columns:1fr}#sidebar{position:sticky;top:0;z-index:20;height:auto;border-right:0;border-bottom:2px solid var(--line);flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow:visible}.brand{padding:0;gap:6px}.brand-sub{display:none}.brand-name{font-size:20px}.brand-mark{width:40px;height:40px}.brand-mark .mascot{width:40px!important;height:40px!important}.nav{flex-direction:row;overflow-x:auto;gap:4px;flex:1;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav-item{padding:7px 10px;font-size:13px;flex:none;gap:6px}.nav-icon{width:22px;height:22px;font-size:17px}.xpbox{display:none}#main{padding:16px 14px 60px}.page-head{flex-direction:column;align-items:flex-start}.two-col,.grid2,.grid3,.grid4,.hero{grid-template-columns:1fr}.two-col .sticky{position:static}.groups{grid-template-columns:repeat(6,1fr)}.fb{grid-template-columns:1fr 1fr}.hero-day .d{font-size:40px}.ring{width:96px;height:96px;right:16px;top:16px}.ring::before{width:72px;height:72px}.ring b{font-size:18px}.task{padding:12px 14px;gap:10px}.task .ic{width:46px;height:46px;font-size:22px}.btn-lg{padding:13px 20px;font-size:17px}.arena canvas{max-height:calc(100vh - 120px)}.strip{grid-template-columns:repeat(15,1fr)}.node{--x:0!important}.node-btn{width:70px;height:70px}}
@media (hover:none){.task:hover,.set-row:hover,.part-card:hover,.dcell:hover{transform:none}.mic{width:120px;height:120px;font-size:48px}}

/* ============ 听力 ============ */
.ic.listen,.task .ic.listening{background:var(--teal-l)}
.nav-item[data-page="listening"].active{background:var(--teal-l);border-color:#7fe3dd;color:var(--teal-d)}
.bars .bar.listen i{background:linear-gradient(90deg,var(--teal),#6fe0d8)}

/* 播放器 */
.player{background:var(--teal-xl);border:2px solid var(--teal-l);border-radius:16px;padding:10px 14px;margin:10px 0}
.player.compact{padding:8px 10px}
.player .play-btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.player.compact .play-btn{padding:9px 16px;font-size:15px;border-radius:12px}
.player .pi{font-size:15px;line-height:1}
.play-count{font-size:13px;font-weight:800;color:var(--muted);margin-left:auto;white-space:nowrap}
.play-count.twice{color:var(--teal-d)}
.wave{display:flex;align-items:center;gap:3px;height:26px;flex:1;min-width:60px;opacity:.35}
.wave i{flex:1;max-width:5px;height:5px;border-radius:99px;background:var(--teal-d);transition:height .18s}
.player.on .wave{opacity:1}
.player.on .wave i{animation:eq .9s ease-in-out infinite}
.player.on .wave i:nth-child(2n){animation-delay:.12s} .player.on .wave i:nth-child(3n){animation-delay:.24s} .player.on .wave i:nth-child(5n){animation-delay:.36s}

.small-seg button{padding:5px 12px;font-size:13px}

/* Part 1 图标选项 */
.pic-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pic-opt{border:3px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;background:#fff;transition:transform .12s,border-color .12s,background .12s}
.pic-opt:hover{transform:translateY(-2px);border-color:var(--teal-l)}
.pic-opt .pe{font-size:46px;line-height:1.1}
.pic-opt .pl{font-size:14px;font-weight:800;color:var(--muted);margin-top:6px}
.pic-opt.sel{border-color:var(--teal);background:var(--teal-xl)}
.pic-opt.sel .pl{color:var(--teal-d)}
.pic-opt.correct{border-color:var(--green);background:var(--green-xl)} .pic-opt.correct .pl{color:var(--green-d)}

@media (hover:none){.pic-opt:hover{transform:none}}

/* 情境提示 */
.lead{background:var(--teal-xl);border-left:5px solid var(--teal);border-radius:0 12px 12px 0;padding:9px 14px;font-size:15px;font-weight:700;color:var(--teal-d);margin-bottom:10px}
.q.lq{border-color:var(--teal-l)}

/* Part 3 笔记卡 */
.note-card{background:#fffdf2;border:3px solid var(--yellow-l);border-radius:18px;padding:6px 0 12px;margin:14px 0;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.note-head{font-family:var(--font-display,inherit);font-size:19px;font-weight:800;letter-spacing:.04em;padding:12px 18px;border-bottom:2px dashed #f0dfa8;display:flex;align-items:center;gap:8px;color:#8a6d00}
.note-head .ni{font-size:22px}
.note-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px dashed #f3e9cd}
.note-line:last-child{border-bottom:0}
.note-line .nl{font-size:15px;font-weight:700;color:#6b5b2a;min-width:180px}
.note-line .nv{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.note-line .nv.fixed{font-weight:700;color:var(--ink)}
.note-line .fix{font-size:15px;font-weight:800;color:#8a6d00}
.note-line .fix.corr{color:var(--green-d)}
.note-line .gnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--yellow-l);color:#8a6d00;font-size:12px;font-weight:800}
.gap-input{width:140px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:15px;font-weight:700;background:#fff}
.gap-input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.gap-input.ok{border-color:var(--green);background:var(--green-xl);color:var(--green-d)}
.gap-input.bad{border-color:var(--red);background:var(--red-l);color:var(--red-d);text-decoration:line-through}
.gap-input:disabled{opacity:1}

/* 听力原文 */
.script-box{margin-top:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg-soft,#fafafa);overflow:hidden}
.script-box summary{cursor:pointer;padding:10px 14px;font-weight:800;font-size:14px;color:var(--muted);user-select:none}
.script-box summary::-webkit-details-marker{display:none}
.script-box summary:hover{color:var(--ink)}
.script-box[open] summary{border-bottom:2px solid var(--line)}
.script-body{padding:12px 16px;font-size:15px;line-height:1.85}
.script-body p{margin:0 0 8px}
.script-body .nar{font-style:italic;color:var(--muted);font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px}
.script-body .sp{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;margin-right:8px;vertical-align:middle;flex:none}
.script-body .sp-M{background:var(--blue-l);color:var(--blue-d)}
.script-body .sp-F{background:#ffe0ef;color:#c2185b}
.script-body .sp-N{background:var(--line);color:var(--muted)}
@media (max-width:1000px){.pic-opts{gap:6px}.pic-opt{padding:10px 4px;border-radius:14px}.pic-opt .pe{font-size:34px}.pic-opt .pl{font-size:12px}.note-line .nl{min-width:0;flex:1 1 100%}.gap-input{width:120px}.play-count{margin-left:0}}

</style>
</head>

  <aside id="sidebar"></aside>

<script>
/* PET Listening Part 1 — 7 段短对话，三选一（真题为图片，此处用图标卡）
   出题要点：三个选项在录音里通常都会被提到，考的是「哪个回答了问题」 */
window.PET_DATA = window.PET_DATA || {};
window.PET_DATA.listening_l1 = [
{ id:'l1-s1', title:'日常小场景 · 一', items:[
  { q:'What will the weather be like this afternoon?',
    script:[{sp:'F',t:"Shall we go to the park after lunch?"},{sp:'M',t:"I'd love to, but look at those clouds. The radio said it rained all morning in the north."},{sp:'F',t:"It says here the rain stops by twelve, and then we get sunshine until the evening."},{sp:'M',t:"Perfect. Let's take the football then."}],
    options:[{emoji:'🌧️',label:'rain'},{emoji:'☀️',label:'sunshine'},{emoji:'☁️',label:'cloudy'}],
    answer:1, why:'雨和云都被提到了，但雨是"上午北方"、云是"现在"。问的是 this afternoon，女孩说 rain stops by twelve, then sunshine until the evening → 下午是晴。' },
  { q:'How will the boy get to the swimming pool?',
    script:[{sp:'M',t:"Mum, can you drive me to the pool at four?"},{sp:'F',t:"Sorry, I'm still at work at four. You could take the number 12 bus."},{sp:'M',t:"It takes ages. I'll just cycle — it's only ten minutes."},{sp:'F',t:"Fine, but wear your helmet."}],
    options:[{emoji:'🚗',label:'by car'},{emoji:'🚌',label:'by bus'},{emoji:'🚲',label:'by bike'}],
    answer:2, why:'车被拒绝（妈妈要上班），公交被男孩嫌慢（takes ages），最后 I\'ll just cycle 才是决定。听"最后拍板的那句"。' },
  { q:'What did the girl forget to bring?',

{ id:'l4-s1', title:'年轻游泳运动员 Maya', intro:'You will hear an interview with Maya, a young swimmer.',
  script:[
    {sp:'M',t:"Today I'm talking to Maya Collins, who at fifteen has just won a national swimming title. Maya, when did you start swimming?"},
    {sp:'F',t:"I was six. My parents didn't push me into it at all — my older brother had lessons and I cried until they let me join in. So it was really my own idea, which I think matters."},
    {sp:'M',t:"You train before school. How do you manage that?"},
    {sp:'F',t:"The alarm goes at half past four and I'm in the water by five. People think the early start is the hard part. Honestly, getting up is fine once it's a habit — what I find difficult is going to bed at nine when my friends are all messaging each other."},
    {sp:'M',t:"Do you ever want to stop?"},
    {sp:'F',t:"There was a bad year when I was twelve. I wasn't improving, and I'd started to think of swimming as a job. My coach made me take a whole month off. I missed it so much that I came back completely different. Now if a session goes badly I just accept it."},
    {sp:'M',t:"What advice would you give a young swimmer?"},
    {sp:'F',t:"Everyone expects me to say train harder. I'd say the opposite — learn to rest properly. The swimmers I started with who never took breaks have mostly given up now. And find a club where you actually like the people."},
    {sp:'M',t:"And after school?"},
    {sp:'F',t:"Everyone assumes I'll swim full time. I'd like to, but I'm also applying to study sports science at university. I'd rather have two doors open than one."}
  ],

{ id:'l4-s2', title:'少年厨师 Tom', intro:'You will hear an interview with Tom, who has written a cookery book for children.',
  script:[
    {sp:'F',t:"Tom Abbot is sixteen and has just published a cookery book. Tom, how did the book start?"},
    {sp:'M',t:"It began as a blog, believe it or not. I was writing down recipes so my little sister could cook when Mum worked late. A publisher found it online and rang our house. I thought it was one of my friends joking."},
    {sp:'F',t:"Who taught you to cook?"},
    {sp:'M',t:"I'm self-taught, mostly from videos. My grandmother is a wonderful cook but she never measures anything, so watching her was useless for learning. She did teach me to taste as I go, which is the one thing I use every day."},
    {sp:'F',t:"Is the book for beginners?"},
    {sp:'M',t:"It's aimed at people my age or younger. Publishers wanted photographs of finished dishes — they always look perfect and nobody's food looks like that. I insisted on drawings instead, showing the steps. That was the only argument we had."},
    {sp:'F',t:"What's the hardest recipe in it?"},
    {sp:'M',t:"People say bread, because it takes hours. Actually bread is forgiving — you can't really ruin it. Rice is the one that catches everyone out. Two minutes too long and it's ruined, and you can't fix it."},
    {sp:'F',t:"Do you want to be a chef?"},
    {sp:'M',t:"I worked in a restaurant kitchen last summer and I loved the food and hated the hours. Sixteen-hour days, no weekends. I'd rather keep cooking as the thing I love and train as a food photographer."}
  ],
  questions:[
    { q:'How did Tom\'s book begin?', options:['as a school project','as a blog','as a family recipe book'],
      answer:1, why:'It began as a blog, believe it or not。' },
    { q:'What did Tom learn from his grandmother?', options:['how to measure ingredients','how to taste while cooking','how to bake bread'],
      answer:1, why:'她 never measures anything（所以不是量），She did teach me to taste as I go。' },
    { q:'Why did Tom want drawings in his book?', options:['They were cheaper.','Photographs look unrealistic.','He drew them himself.'],
      answer:1, why:'they always look perfect and nobody\'s food looks like that → 照片不真实。' },
    { q:'Which recipe does Tom say is hardest?', options:['bread','rice','cake'],
      answer:1, why:'面包是 people say，但他说 bread is forgiving。Rice is the one that catches everyone out。' },
    { q:'What did Tom dislike about working in a restaurant?', options:['the food','the long hours','the other staff'],
      answer:1, why:'loved the food and hated the hours + Sixteen-hour days。' },
    { q:'What does Tom want to do in the future?', options:['become a chef','photograph food','open a restaurant'],
      answer:1, why:'I\'d rather keep cooking as the thing I love and train as a food photographer。' }
  ] },
{ id:'l4-s3', title:'旧书店店主 Ruth', intro:'You will hear an interview with Ruth, who runs a second-hand bookshop.',
  script:[
    {sp:'M',t:"Ruth Hale has run a second-hand bookshop for twenty years. Ruth, how did you start?"},
    {sp:'F',t:"By accident. I was a maths teacher and I'd collected far too many books. When the shop on this street came up for sale, my husband said it as a joke and I said yes before I'd really thought about it."},
    {sp:'M',t:"Has the internet hurt your business?"},
    {sp:'F',t:"Everybody asks that, expecting me to complain. Selling online actually saved us — I now post books all over the world. What's changed is that people come in less often but stay much longer when they do."},
    {sp:'M',t:"What's the most valuable book you've sold?"},
    {sp:'F',t:"A first edition worth six hundred pounds. But the one I remember is a shabby little children's book a man bought for two pounds. He'd been searching thirty years for the copy his mother read to him. He cried in the doorway."},
    {sp:'M',t:"Do you read everything you sell?"},
    {sp:'F',t:"I'd never sleep! I read the first page of everything that comes in — you learn a lot from a first page. And I keep far too many. My husband says the house is now the overflow shop."},
    {sp:'M',t:"What's the hardest part of the job?"},
    {sp:'F',t:"Not the money, though there's never much. It's turning people away. Someone brings in their late father's books hoping they're worth something, and usually they're worth nothing at all. Telling them that never gets easier."}
  ],
  questions:[
    { q:'How did Ruth come to own the shop?', options:['She planned it for years.','She decided very quickly.','She inherited it.'],
      answer:1, why:'I said yes before I\'d really thought about it → 决定得很快。' },
    { q:'What does Ruth say about the internet?', options:['It has damaged her business.','It has helped her business.','It has made no difference.'],
      answer:1, why:'Selling online actually saved us。开头 expecting me to complain 就是在预告"和你想的相反"。' },
    { q:'Which sale does Ruth remember most?', options:['a six-hundred-pound first edition','a cheap children\'s book','her first ever sale'],
      answer:1, why:'贵的那本只是"最值钱"，But the one I remember 引出便宜的童书。问 remember most 不是问最贵。' },
    { q:'How much of each book does Ruth read?', options:['all of it','the first page','none of it'],
      answer:1, why:'I read the first page of everything that comes in。' },
    { q:'What does Ruth\'s husband complain about?', options:['the shop\'s opening hours','the books at home','the cost of the shop'],
      answer:1, why:'I keep far too many + the house is now the overflow shop。' },
    { q:'What does Ruth find hardest?', options:['earning enough money','telling people their books are worthless','carrying heavy boxes'],
      answer:1, why:'Not the money 明确排除。It\'s turning people away + usually they\'re worth nothing at all。' }
  ] },
{ id:'l4-s4', title:'野生动物摄影师 Dan', intro:'You will hear an interview with Dan, a wildlife photographer.',
  script:[
    {sp:'F',t:"Dan Price photographs wildlife. Dan, was this always the plan?"},
    {sp:'M',t:"Not at all. I trained as an engineer and did it for nine years. I took photographs at weekends and one of them won a competition. Even then I didn't leave my job — it took another three years and a lot of arguing with myself."},
    {sp:'F',t:"What makes a good wildlife photograph?"},
    {sp:'M',t:"Beginners think it's the equipment. My most successful photograph was taken on a camera I'd had for eleven years. It's patience, and knowing the animal. If you understand what a bird does at six in the morning, you don't need luck."},
    {sp:'F',t:"What's the longest you've waited for a shot?"},
    {sp:'M',t:"Nineteen days in a hide in Scotland for an eagle. On day nineteen it landed three metres away. People imagine that's the exciting bit — actually I was so cold I could hardly press the button."},
    {sp:'F',t:"Is any of it dangerous?"},
    {sp:'M',t:"Less than people think. Large animals give you plenty of warning if you know the signs. The real risk is the weather and the ground — I broke my ankle stepping into a hole, two hundred metres from the car park."},
    {sp:'F',t:"What would you say to someone starting out?"},
    {sp:'M',t:"Don't travel. Everyone wants to fly somewhere with lions. Photograph the foxes in your own town for a year — you'll learn more, and the pictures will be better because you know the place."}
  ],
  questions:[
    { q:'What did Dan do before photography?', options:['He was an engineer.','He was a teacher.','He was a guide.'],
      answer:0, why:'I trained as an engineer and did it for nine years。' },
    { q:'How quickly did Dan change careers?', options:['immediately after winning','after three more years','he has not changed yet'],
      answer:1, why:'Even then I didn\'t leave my job — it took another three years。' },
    { q:'What does Dan say matters most in wildlife photography?', options:['expensive equipment','patience and knowledge','good luck'],
      answer:1, why:'器材是 beginners think；you don\'t need luck 排除运气。It\'s patience, and knowing the animal。' },
    { q:'How did Dan feel when the eagle finally landed?', options:['excited','too cold to react','frightened'],
      answer:1, why:'People imagine that\'s the exciting bit — actually I was so cold I could hardly press the button。' },
    { q:'What is the biggest danger in Dan\'s work?', options:['large animals','the ground and weather','other photographers'],
      answer:1, why:'大动物 give you plenty of warning。The real risk is the weather and the ground + 摔断脚踝的例子。' },
    { q:'What does Dan advise beginners to do?', options:['travel abroad','photograph animals near home','buy a better camera'],
      answer:1, why:'Don\'t travel 直接否定出国。Photograph the foxes in your own town for a year。' }
  ] },
{ id:'l4-s5', title:'学生乐队主唱 Priya', intro:'You will hear an interview with Priya, the singer in a student band.',
  script:[
    {sp:'M',t:"Priya Shah sings in the band Northlight. Priya, how did the band form?"},
    {sp:'F',t:"We all did music at school but we weren't friends — the drummer and I were in different years. It was actually our music teacher who put us together for a concert, and we just kept going afterwards."},
    {sp:'M',t:"You write your own songs. Where do the ideas come from?"},
    {sp:'F',t:"Not from other bands, which is what people assume. Most of mine start from something someone says on a bus or in a queue. I've got about two hundred notes on my phone that are just single sentences."},
    {sp:'M',t:"What was your first concert like?"},
    {sp:'F',t:"Eleven people came, four of them our parents. We'd practised for three months. Honestly it was the best thing that could have happened — if two hundred people had come and we'd been terrible, we might have stopped."},
    {sp:'M',t:"How do you fit the band around school?"},
    {sp:'F',t:"It's not the practising, that's only two evenings. It's that we say no to almost everything. No band on Sunday, and none of us plays anywhere in exam term. Our guitarist nearly failed his exams last year and that frightened all of us."},
    {sp:'M',t:"What happens after school?"},
    {sp:'F',t:"Two of them want to go professional immediately. I want us all to finish studying first. We've agreed to give it five years and then decide properly, which I think is the sensible way round."}
  ],
  questions:[
    { q:'How did the band come together?', options:['They were already friends.','A teacher put them together.','They met online.'],
      answer:1, why:'we weren\'t friends 明确排除 A。It was actually our music teacher who put us together。' },
    { q:'Where does Priya get ideas for songs?', options:['from other bands','from things people say','from books'],
      answer:1, why:'Not from other bands, which is what people assume。start from something someone says on a bus。' },
    { q:'How does Priya feel about their first concert?', options:['She is glad it was small.','She was disappointed.','She thought they played badly.'],
      answer:0, why:'it was the best thing that could have happened + 假设句解释了为什么人少反而好。' },
    { q:'What is difficult about being in the band?', options:['finding time to practise','refusing other activities','paying for equipment'],
      answer:1, why:'It\'s not the practising 直接排除。It\'s that we say no to almost everything。' },
    { q:'Why is the band careful during exam term?', options:['Their guitarist almost failed.','Their parents stopped them.','The school banned them.'],
      answer:0, why:'Our guitarist nearly failed his exams last year and that frightened all of us。' },
    { q:'What does Priya want the band to do?', options:['turn professional now','finish their studies first','stop playing together'],
      answer:1, why:'Two of them 想马上转职业，但问的是 Priya：I want us all to finish studying first。' }
  ] }
];

   "Priya's own hives are on the roof of the building where her grandmother lives. The residents were nervous at the beginning. 'People imagine bees flying into their kitchens,' she says. 'But bees fly straight up and away to find flowers. In three years, nobody has been stung.' To thank the residents, she gives every family a jar of honey each autumn. 'Now they argue about who gets the biggest jar.'",
   "City honey, Priya explains, is often better than honey from the countryside. 'In the country, there are huge fields with only one kind of flower. In the city, there are parks, gardens, balconies, trees along the street – hundreds of different plants. The honey tastes of all of them.'",
   "The hardest time was her first winter, when one of her two hives died. 'I cried for a whole day. Then I worked out what I'd done wrong – I hadn't left them enough food. You learn more from a mistake like that than from any book.' She now has six hives and sells honey at the Saturday market to pay for her equipment.",

{ id:'p3-s4', title:'Life on a canal boat', intro:'Read the article about a boy who lives on a boat. For each question, choose the correct answer.',
  paragraphs:[
   "Fourteen-year-old Ben Fletcher has lived on a canal boat since he was six. His parents sold their house and bought the boat, called 'Slow Rose', after his father lost his job. 'They thought it would be for a year or two,' Ben says. 'That was eight years ago. None of us wants to go back to a house now.'",
   "The boat is eighteen metres long and just over two metres wide. Ben's bedroom is at the front and is smaller than most people's bathrooms. 'When my friends first visit, they can't believe how tiny it is,' he says. 'But I've got everything I need. You learn not to keep things you don't use. I probably own about a tenth of what my friends own, and I don't miss any of it.'",
   "The family moves the boat every two weeks – the rules say you cannot stay in one place longer than that. This means Ben has been to eleven different schools. 'That sounds awful, and sometimes it was,' he admits. 'Walking into a new class where everyone already has friends is hard. But now I can talk to anyone. My mum says I could make friends with a lamp post.' For the last two years, the family has stayed near one town so that Ben can do his exams at the same school.",
   "There are practical problems, too. Water for washing and cooking comes from a tank that has to be filled every few days, and in winter the canal sometimes freezes, so the boat cannot move at all. 'Last January we were stuck for three weeks,' Ben says. 'We had to carry the shopping across a frozen field.' Electricity comes from solar panels on the roof, which means Ben cannot play computer games for long in winter, when there is little sun. 'My friends think that's the worst thing about the boat. I think it's the best. I read a lot.'",
   "Would Ben live on a boat as an adult? 'Definitely,' he says. 'But a slightly bigger one.'"

  paragraphs:[

   "At first, the blog was just for Tara herself and a few friends. Then a food magazine mentioned it in an article about young cooks, and suddenly thousands of people were reading it. 'That was frightening, actually,' she says. 'Before, if I made a mistake in a recipe, nobody noticed. Now people write to tell me their cake didn't rise. I had to become much more careful. I test every recipe three times now.'",
   "Tara writes about food from all over the world, but she has one rule: every recipe must be possible in a small kitchen with basic equipment. 'Lots of food websites tell you to buy special machines,' she says. 'I have one saucepan, one frying pan and one oven tray. If I can make it, anyone can.' Her most popular post, a one-pan pasta dish, has been read over half a million times.",
   "The blog takes about ten hours a week – cooking, photographing, writing and answering messages. Tara's parents insist that schoolwork comes first, so most blog work happens on Sundays. 'Sometimes I'd rather be out with my friends,' she admits. 'But then somebody sends me a photo of the dish they've made for their family, and I remember why I do it.'",
   "She has been offered money by companies to write about their products, but has always said no. 'The moment I start selling things, people won't trust me,' she says. 'My readers are mostly students without much money. I want them to know that I'm on their side.' What next? 'A book, maybe. But I'd still have to test everything three times.'"

  paragraphs:[
   "When Lucas Weber was fifteen, his family moved from Germany to Scotland for a year because of his mother's job. He spoke good English – or thought he did. 'On my first day at school, the boy next to me said something and I had no idea what it was,' he remembers. 'I'd learnt English from films and video games. Nobody in a film speaks like people in Aberdeen.'",
   "For the first month, Lucas said as little as possible. 'I was afraid of making mistakes. I used to prepare sentences in my head, and by the time they were ready, the conversation had moved on.' The change came, he says, because of football. 'I joined the school team. When you're playing, there's no time to think about grammar. You just shout. And nobody cares if it's wrong.' Within a few weeks he was talking all the time, mistakes and all.",
   "Lucas noticed differences in the classroom, too. 'In Germany, my lessons were mostly the teacher talking and us writing. Here, we spent a lot of time in groups, discussing things and presenting to the class. At first, I found it a bit disorganised. By the end, I preferred it. I remember things much better when I've argued about them.'",
   "The weather was another surprise. 'Everyone warned me about the rain, and they were right. But nobody told me about the light. In summer it doesn't get dark until eleven o'clock. We played football at ten in the evening in bright sunshine. In winter, of course, it's the opposite – I walked to school in the dark and came home in the dark.'",
   "Lucas is now back in Germany and is studying for his final exams. He still speaks to his Scottish friends every week. 'People ask me if the year was good for my English, and it was. But that's not the main thing. I learnt that being confused and uncomfortable is fine. It doesn't last. And you come out the other side with more than you had before.'"

{ id:'L0', part:'overview', title:'PET 考试全貌：考什么、怎么算分、这个 App 练什么', minutes:8, sections:[
 { h:'PET 是什么', html:`<p><b>PET = B1 Preliminary</b>（剑桥通用五级第二级）。青少年版叫 <b>B1 Preliminary for Schools</b>，题型、评分、证书与成人版完全相同，只是话题更贴近校园生活。本 App 按 for Schools 的话题编排。</p>` },
 { h:'四张试卷', html:`<table class="tbl"><tr><th>试卷</th><th>时长</th><th>结构</th><th>占比</th></tr>
<tr><td>Reading 阅读</td><td>45 分钟</td><td>6 部分，32 题</td><td>25%</td></tr>
<tr><td>Writing 写作</td><td>45 分钟</td><td>2 部分（邮件 + 文章/故事，各约 100 词）</td><td>25%</td></tr>
<tr><td>Listening 听力</td><td>约 30 分钟</td><td>4 部分，25 题</td><td>25%</td></tr>
<tr><td>Speaking 口语</td><td>12–17 分钟</td><td>4 部分，两名考生一组，两名考官</td><td>25%</td></tr></table>
<p>本 App 练 <b>Reading + Listening + Speaking</b>（合计 75%）。Writing 请用官方免费样题（cambridgeenglish.org → B1 Preliminary for Schools → Exam preparation → Sample papers）。</p>
<p class="note">听力录音由电脑朗读（可调语速），不是真人录音。真考是英式真人录音、带口音和背景噪音，考前一定要用官方样题的真录音再适应一次。</p>` },
 { h:'分数怎么算', html:`<p>成绩用 <b>剑桥英语量表（Cambridge English Scale）</b>报告，PET 的报告区间是 120–170：</p>
<table class="tbl"><tr><th>分数</th><th>等级</th><th>证书</th></tr>
<tr><td>160–170</td><td>Grade A（Pass with Distinction）</td><td>B2 级证书</td></tr>
<tr><td>153–159</td><td>Grade B（Pass with Merit）</td><td>B1 级证书</td></tr>
<tr><td>140–152</td><td>Grade C（Pass）</td><td>B1 级证书</td></tr>
<tr><td>120–139</td><td>未通过</td><td>A2 级证书</td></tr></table>
<p>四张卷各算一个分数，总分是四卷平均。<b>140 = 通过线，160 = B2 线。</b>经验换算（旧版原始分标准）：阅读正确率约 70% ≈ 140，85% ≈ 153，90% ≈ 160。本 App 的“预估分数”就按这个经验换算，只作参考。</p>` },
 { h:'阅读 6 部分速览', html:`<table class="tbl"><tr><th>部分</th><th>题数</th><th>考什么</th><th>建议用时</th></tr>
<tr><td>Part 1 告示/短信</td><td>5</td><td>读懂标牌、短信、邮件的真正意思</td><td>5 分钟</td></tr>
<tr><td>Part 2 人物配对</td><td>5</td><td>5 个人 ↔ 8 段短文，找完全满足条件的那个</td><td>8 分钟</td></tr>
<tr><td>Part 3 长文选择</td><td>5</td><td>细节、观点、态度、主旨</td><td>8 分钟</td></tr>
<tr><td>Part 4 句子填空</td><td>5</td><td>从 8 句里选 5 句填回文章，考上下文衔接</td><td>8 分钟</td></tr>
<tr><td>Part 5 词汇完形</td><td>6</td><td>四选一，考词汇搭配</td><td>6 分钟</td></tr>

 { h:'口语 4 部分速览', html:`<table class="tbl"><tr><th>部分</th><th>时长</th><th>形式</th></tr>
<tr><td>Part 1 问答</td><td>约 2 分钟</td><td>考官逐个问个人问题（名字、住哪、爱好、学校）</td></tr>
<tr><td>Part 2 图片描述</td><td>约 3 分钟</td><td>每人一张彩色照片，独自描述约 1 分钟</td></tr>

<tr><td>Part 4 深入讨论</td><td>约 3 分钟</td><td>考官围绕 Part 3 的话题问更开放的问题</td></tr></table>
<p>评分四维（各 0–5 分）：<b>Grammar and Vocabulary</b>（语法词汇）、<b>Discourse Management</b>（能不能连贯地说一段）、<b>Pronunciation</b>（发音）、<b>Interactive Communication</b>（互动：会接话、会提问、会让对方说）。另有一名考官给整体分。</p>` },
 { h:'这个 App 怎么用', html:`<ol><li><b>每天一练</b>：打开“今日任务”，25 分钟左右：1 个阅读部分（限时）+ 1 个口语任务（录音）+ 10 张单词卡。</li><li><b>先学后练</b>：每个部分第一次出现前，会安排一节教程（就是你现在看的这种）。</li><li><b>周日复盘</b>：回看本周错题和录音。</li><li><b>第 9 周起模考</b>：每周一次完整阅读模考（45 分钟）+ 一次完整口语模拟。</li></ol>
<p>考位提醒：国内 PET for Schools 考位紧张，请尽早在剑桥官方渠道关注报名时间，并把考试日期填进 App 设置。</p>` }

{ id:'L1', part:'p1', title:'阅读 Part 1：告示与短信——读懂“真正的意思”', minutes:6, sections:[
 { h:'题型', html:`<p>5 段真实生活中的短文本：标牌、告示、便条、短信、邮件。每段配 3 个句子（A/B/C），选出<b>与原文意思一致</b>的那句。</p>` },
 { h:'三步法', html:`<ol><li><b>先看它是什么</b>：标牌？短信？谁写给谁？在哪里出现？（题目上方通常有提示）</li><li><b>找出“核心动作”</b>：这段文字想让读者做什么 / 知道什么？通常是一句祈使句或一个条件（must / can / if / only / until）。</li><li><b>逐个排除</b>：三个选项里有两个是“陷阱”——用了原文里的词，但意思被改了。</li></ol>` },
 { h:'四种常见陷阱', html:`<table class="tbl"><tr><th>陷阱</th><th>例子</th></tr>
<tr><td>把“条件”当“事实”</td><td>原文 <i>If found, please take it to the office</i>（如果找到）→ 选项 “Someone found a bag”（有人已经找到）✗</td></tr>
<tr><td>范围放大</td><td>原文 <i>Half price on all winter coats</i> → 选项 “Everything is half price” ✗</td></tr>
<tr><td>时间/人物换掉</td><td>原文 <i>Trains to the airport now leave from Platform 5</i> → 选项 “Platform 5 is closed” ✗</td></tr>
<tr><td>反义</td><td>原文 <i>Drivers do not give change</i> → 选项 “Drivers will give you change” ✗</td></tr></table>` },
 { h:'高频词', html:`<p><b>must / have to</b>（必须）· <b>can / are allowed to</b>（可以）· <b>only</b>（仅限）· <b>unless</b>（除非）· <b>until</b>（直到）· <b>up to</b>（最多）· <b>at least</b>（至少）· <b>in advance</b>（提前）· <b>available</b>（可获得）· <b>free</b>（免费）· <b>exchange / refund</b>（换货/退款）· <b>pick up</b>（接/取）· <b>let sb know</b>（告知）</p>` },
 { h:'练习方式', html:`<p>每题 1 分钟。做完看解析时，把选错的那道题的“陷阱类型”记下来。同一种陷阱错两次以上，就是你的弱点。</p>` }
]},

{ id:'L2', part:'p2', title:'阅读 Part 2：人物配对——三条件全满足才算对', minutes:6, sections:[
 { h:'题型', html:`<p>左边 5 个人，每人一段描述（通常包含 <b>3 个要求</b>）；右边 8 段短文（A–H，比如 8 本书 / 8 个景点 / 8 个夏令营）。给每个人选最合适的一段。8 段里有 3 段是干扰项。</p>` },
 { h:'方法：画线 → 打勾', html:`<ol><li><b>先读人物</b>，把每个人的要求用笔画出来，一般是 3 条：<i>Ola wants to <u>make things with her hands</u>. She is only free <u>on Fridays</u>, and she <u>can't afford materials</u>.</i></li><li><b>再扫 8 段短文</b>，找到满足第 1 条的候选（通常 2 段）。</li><li><b>用第 2、3 条淘汰</b>：干扰项的设计就是“满足两条、违反一条”。比如 Art Club 也是周五、也是动手，但要求“自带材料”——不行。</li><li>做完 5 个人，检查每个字母只用一次。</li></ol>` },
 { h:'干扰项长什么样', html:`<ul><li><b>同一话题不同条件</b>：两个都是航海课，一个“欢迎零基础”，一个“不适合初学者”。</li><li><b>否定词</b>：<i>no café</i> / <i>not suitable for beginners</i> / <i>cannot be brought in</i>。</li><li><b>数字和时间</b>：年龄段、星期几、几点结束、价格。</li></ul>` },
 { h:'时间分配', html:`<p>8 分钟。人物读 1 分钟，短文扫 3 分钟，配对 3 分钟，检查 1 分钟。不要按 A→H 顺序精读，要<b>带着人物的条件去找</b>。</p>` }
]},

{ id:'L3', part:'p3', title:'阅读 Part 3：长文选择——题干顺序 = 文章顺序', minutes:7, sections:[
 { h:'题型', html:`<p>一篇 350–400 词的文章（通常写一个人的经历、采访、博客），5 道四选一。考：细节、原因、态度感受、主旨、以及“这个人会怎么说”。</p>` },
 { h:'核心规律', html:`<ul><li><b>题目顺序和文章顺序一致</b>：第 1 题在第 1 段附近，第 5 题在末段。第 5 题常是全文总结题。</li><li><b>先读题干，不读选项</b>：把 5 个题干读一遍，知道要找什么，再读文章。读到答案位置时再看选项。</li><li><b>同义替换</b>：题目不会照抄原文。<i>hardest</i> = <i>most difficult</i>；<i>frightening</i> = <i>nervous</i>；<i>raise money for the shelter where she helps</i> = <i>help an organisation she works with</i>。</li></ul>` },
 { h:'四类题怎么答', html:`<table class="tbl"><tr><th>题型</th><th>题干特征</th><th>怎么找</th></tr>
<tr><td>细节题</td><td>What / When / Why did…</td><td>定位关键词，看前后两句</td></tr>
<tr><td>态度题</td><td>How did X feel… / What does X think about…</td><td>找 <i>says / thinks / admits / remembers</i> 后面的引语和情感词</td></tr>
<tr><td>主旨题</td><td>What is the writer's main purpose…</td><td>看整篇讲的是什么，排除只讲一段的选项</td></tr>
<tr><td>“会怎么说”题</td><td>What would X say… / Which sentence best describes…</td><td>每个选项都要和原文对一遍，找唯一不冲突的</td></tr></table>` },
 { h:'排除法', html:`<p>错误选项通常：① 说了文章没说的事；② 用了原文的词但意思反了；③ 只对了一半（前半句对，后半句错，如 “badly organised <u>from beginning to end</u>”）。</p>` }
]},

{ id:'L4', part:'p4', title:'阅读 Part 4：句子填空——看指代词和连接词', minutes:7, sections:[
 { h:'题型', html:`<p>一篇文章被抽走 5 句，给你 8 句（A–H），选 5 句填回去。3 句是干扰项。考的是<b>上下文衔接</b>，不是词汇。</p>` },
 { h:'四个线索', html:`<table class="tbl"><tr><th>线索</th><th>例子</th></tr>
<tr><td><b>指代词</b> she / he / it / this / they / them</td><td>后一句 “<u>She</u> gave me three bean bags” → 空里必须先出现一个女性（my aunt）</td></tr>
<tr><td><b>连接词</b> but / though / so / also / then</td><td>后一句 “After a few minutes, <u>though</u>…” → 空里是相反的情况（孩子们起初害羞）</td></tr>
<tr><td><b>时间顺序</b> at first / then / by the end / now</td><td>先有 “We put posters”，才能有 “The posters had a photo”</td></tr>
<tr><td><b>话题一致</b></td><td>前一句说“食物垃圾最让人吃惊”，空里必须继续说食物垃圾</td></tr></table>` },
 { h:'步骤', html:`<ol><li>先通读全文（跳过空），知道故事讲什么。</li><li>逐空看<b>前一句和后一句</b>，圈出指代词/连接词。</li><li>先填最有把握的空，把用过的字母划掉。</li><li>最后把整段连起来读一遍：读着别扭就换。</li></ol>` },
 { h:'识别干扰项', html:`<p>干扰句常常是“看起来相关的常识”（<i>Plastic takes hundreds of years to break down</i>）或“和文章矛盾的细节”（文章说朋友，干扰句说弟弟）。它们放进任何一个空，前后都接不上。</p>` }
]},

{ id:'L5', part:'p5', title:'阅读 Part 5：词汇完形——看空格的左右邻居', minutes:6, sections:[
 { h:'题型', html:`<p>一篇 150 词短文，6 个空，每空 4 个选项。4 个选项<b>词性相同、意思相近</b>（比如 afford / pay / spend / cost），考的是哪个词能和前后的词搭配。</p>` },
 { h:'方法', html:`<ol><li>先读完整篇，知道大意。</li><li>回到每个空，<b>看空格左右各 3 个词</b>：后面跟什么介词？前面是什么名词？</li><li>把 4 个选项逐个代入读一遍，哪个“听起来像英语”就是哪个。</li><li>不确定就先排除：介词不对的（cause <s>to</s>）、语法不对的（most <s>hard</s>）。</li></ol>` },
 { h:'高频考点', html:`<ul><li><b>动词 + 介词</b>：lead <b>to</b> / spread <b>to</b> / worried <b>about</b> / afraid <b>of</b> / pay <b>for</b>。</li><li><b>固定搭配</b>：pay attention · make it possible · set up · sort out · take part · have fun · for example · at least。</li><li><b>近义词区分</b>：fee（会费）/ fare（车费）/ price（价格）；trip / journey / travel；borrow / lend；take（花时间，主语是 it）/ spend（主语是人）。</li><li><b>-ed 和 -ing</b>：I'm bored（我感到无聊）vs. It's boring（它很无聊）。</li></ul>` }
]},

{ id:'L6', part:'p6', title:'阅读 Part 6：语法填空——一空一词，读完整句再填', minutes:6, sections:[
 { h:'题型', html:`<p>一篇短文 6 个空，<b>没有选项</b>，每空填一个词。考的是语法“小词”，不是难词。</p>` },
 { h:'空里通常是什么词', html:`<table class="tbl"><tr><th>类型</th><th>例子</th></tr>
<tr><td>冠词</td><td>a / an / the：<i>a bottle of water</i></td></tr>
<tr><td>介词</td><td>for / on / in / at / of / to：<i>Thanks <b>for</b> your message · <b>on</b> Saturday · by the age <b>of</b> ten</i></td></tr>
<tr><td>助动词 / be</td><td>have / has / was / were / will / be：<i><b>Have</b> you seen…? · there will <b>be</b> a café</i></td></tr>
<tr><td>关系词</td><td>who / which / that / where：<i>a school <b>where</b> he hopes to study</i>；逗号后只能 which</td></tr>
<tr><td>连词</td><td>but / although / if / when / because / so：<i>not sure <b>if</b> he's old enough</i></td></tr>
<tr><td>代词 / 限定词</td><td>one / most / them / us / it：<i>let <b>us</b> know · <b>most</b> of the day</i></td></tr>
<tr><td>比较级 / 数量</td><td>more / than / as / much：<i>more <b>than</b> six tonnes</i></td></tr>
<tr><td>固定短语</td><td>look <b>after</b> · pick <b>up</b> · <b>had</b> better · as quietly as he <b>could</b></td></tr></table>` },
 { h:'检查清单', html:`<ol><li>填完读整句：主谓一致？时态一致？（<i>Last weekend I <b>went</b></i>）</li><li>只能填<b>一个词</b>，不能填两个，也不能缩写成 “didn't”（除非本来就是一个词）。</li><li>拼写要对，大小写不影响。</li></ol>` }
]},

{ id:'L7', part:'s1', title:'口语 Part 1：问答——A+R+E 公式', minutes:6, sections:[
 { h:'流程', html:`<p>考官先问基本信息（<i>What's your name? Where do you live? Do you study English at school?</i>），然后问 2–3 个个人话题问题（爱好、学校、家庭、周末、食物、旅行）。约 2 分钟，两个考生轮流。</p>` },
 { h:'A + R + E', html:`<table class="tbl"><tr><th>步骤</th><th>说什么</th><th>例子</th></tr>
<tr><td><b>A</b>nswer 直接回答</td><td>一句话回答问题</td><td><i>My favourite subject is science,</i></td></tr>
<tr><td><b>R</b>eason 理由</td><td>because…</td><td><i>because we do experiments and I like finding out how things work.</i></td></tr>
<tr><td><b>E</b>xample 例子</td><td>一个具体细节</td><td><i>Last week we made a small volcano, which was really exciting.</i></td></tr></table>
<p>三句话，10–20 秒。<b>只答一个词（“Science.”）是 Part 1 最大的失分点</b>。</p>` },
 { h:'时态是评分点', html:`<ul><li><i>What did you do last weekend?</i> → 过去式：went / played / had</li><li><i>What are you going to do next summer?</i> → be going to</li><li><i>Tell me about a book you have read recently.</i> → 现在完成时 + 过去式</li><li><i>How often…?</i> → usually / twice a week / every day</li></ul>` },
 { h:'没听清怎么办', html:`<p>说 <i>Sorry, could you repeat that, please?</i> 或 <i>Sorry, I didn't catch that.</i> —— 这不扣分，反而是“互动能力”的加分项。沉默才扣分。</p>` },
 { h:'练法', html:`<p>App 里每题：① 听考官提问 → ② 点录音回答 → ③ 看转写文本和字数/时长 → ④ 听范例 → ⑤ 跟读一遍。目标：每题 15–25 秒、至少一个 because。</p>` }
]},

{ id:'L8', part:'s2', title:'口语 Part 2：描述照片——六步框架撑满 1 分钟', minutes:7, sections:[
 { h:'流程', html:`<p>考官给你一张彩色照片，说：<i>Please tell us what you can see in the photograph.</i> 你<b>一个人说约 1 分钟</b>，考官不会插话，也不会提示。说完轮到另一位考生描述另一张照片。</p>` },
 { h:'六步框架（背下来）', html:`<table class="tbl"><tr><th>步骤</th><th>句型</th></tr>
<tr><td>① 总体一句</td><td><i>In this picture I can see a family having dinner at home.</i></td></tr>
<tr><td>② 人物 + 位置</td><td><i>On the left there's a woman… In the middle… In the background…</i></td></tr>
<tr><td>③ 正在做什么（现在进行时）</td><td><i>The boy is holding a plate. They are all smiling.</i></td></tr>
<tr><td>④ 穿着 / 物品 / 天气</td><td><i>She's wearing a blue T-shirt. There are lots of dishes on the table. It looks sunny.</i></td></tr>
<tr><td>⑤ 猜测</td><td><i>I think it's a birthday, because… Maybe they're… It looks like…</i></td></tr>
<tr><td>⑥ 感受 / 结尾</td><td><i>They look very happy. I'd like to be there, because…</i></td></tr></table>` },
 { h:'位置词', html:`<p>on the left / on the right / in the middle / at the top / at the bottom / in the front / in the background / next to / behind / in front of / between</p>` },
 { h:'不知道单词怎么办', html:`<p><b>绕过去（paraphrase）</b>：不知道 “trolley”，就说 <i>a thing you push in a supermarket to carry food</i>。这是 B1 口语的核心技能，考官会加分。不要停下来沉默。</p>` },
 { h:'常见问题', html:`<ul><li>说了 20 秒就没话了 → 用六步框架，每步至少一句。</li><li>只列名词（<i>A table, a chair, a woman…</i>）→ 要用完整句子和 -ing。</li><li>讲故事而不是描述 → 先描述看得见的，猜测放最后。</li></ul>` }
]},

{ id:'L9', part:'s3', title:'口语 Part 3：合作讨论——轮流、提议、回应、决定', minutes:7, sections:[
 { h:'流程', html:`<p>考官读一个情境（<i>A boy is going to spend a weekend in the countryside…</i>），给一张图，上面有 <b>5 个选项</b>。两个考生<b>互相讨论</b>（不是对考官说），约 2–3 分钟，最后要<b>做出一个决定</b>。评分重点是 <b>Interactive Communication</b>：会接话、会问对方、会让对方说。</p>` },
 { h:'一轮对话的结构', html:`<table class="tbl"><tr><th>功能</th><th>句型</th></tr>
<tr><td>开始</td><td><i>Shall we start with…? / Let's talk about… first.</i></td></tr>
<tr><td>提议 + 理由</td><td><i>I think… would be useful, because… / What about…?</i></td></tr>
<tr><td>同意</td><td><i>I agree. / That's a good idea. / Good point.</i></td></tr>
<tr><td>部分同意 / 不同意</td><td><i>That's true, but… / I'm not sure about that, because… / I see what you mean, but…</i></td></tr>
<tr><td>问对方</td><td><i>What do you think? / Don't you think? / Do you agree?</i></td></tr>
<tr><td>决定</td><td><i>So, shall we choose…? / I think… is the best, because… / OK, let's go with that.</i></td></tr></table>` },
 { h:'三条纪律', html:`<ol><li><b>不要一个人说完</b>：每说 2–3 句就把话交给对方（<i>What do you think?</i>）。</li><li><b>至少讨论 3–4 个选项</b>，每个说一个优点或一个缺点，不要 5 个全说“good idea”。</li><li><b>一定要做决定</b>：考官说 “thank you” 之前，你们要说出 “Let's choose…”。</li></ol>` },
 { h:'App 里怎么练', html:`<p>App 扮演你的搭档：它先说一段，你录音回应，它再接着说。每轮都有中文提示告诉你这一轮该做什么（回应 + 提出下一个选项 / 做决定）。练熟以后，让家长扮演搭档，脱离提示再练。</p>` }
]},

{ id:'L10', part:'s4', title:'口语 Part 4：深入讨论——观点 + 理由 + 例子', minutes:6, sections:[
 { h:'流程', html:`<p>考官围绕 Part 3 的话题问更开放的问题（<i>Do you prefer the countryside or the city? Why?</i>）。可能问一个人，也可能说 <i>What do you think, Ben?</i> 让另一个人接。约 3 分钟。</p>` },
 { h:'回答结构', html:`<p><b>观点 → 理由 → 例子 → （对比/让步）</b></p>
<p><i>I prefer the city, <b>because</b> there's always something to do. <b>For example</b>, my friends live near me and we can go to the cinema. <b>But</b> I like visiting the countryside for a few days, because it's quiet.</i></p>
<p>每题 20–40 秒，比 Part 1 长，比 Part 2 短。</p>` },
 { h:'有用的句型', html:`<ul><li>表观点：<i>In my opinion… / I think… / Personally, I…</i></li><li>让步：<i>It depends. / Some people…, but I… / On the other hand…</i></li><li>接搭档的话：<i>I agree with Ben, and I'd add that… / I don't really agree, because…</i></li><li>没想法时：<i>That's a difficult question. I've never thought about it, but I suppose…</i>（争取思考时间，不要沉默）</li></ul>` },
 { h:'评分提醒', html:`<p>Part 4 看的是 <b>Discourse Management</b>：能不能把 3–4 句话连成一段，用 because / so / but / for example 串起来。词汇不用高级，连贯最重要。</p>` }
]},

{ id:'L14', part:'l1', title:'听力 Part 1：短对话——三个选项都会被念到', minutes:6, sections:[
 { h:'题型长什么样', html:`<p>7 段短对话，每段配一个问题和三个选项（真考是三张图，本 App 用图标卡）。每段<b>放两遍</b>，两遍之间有停顿。</p><p>话题永远是日常生活：天气、时间、价格、交通、东西放哪了、买了什么。</p>` },
 { h:'最重要的一件事', html:`<p><b>三个选项通常都会在录音里被念到。</b>听到 "bus" 就选 bus，必错。考的不是"有没有听到这个词"，而是"哪个回答了那个问题"。</p><p>例：问 How will he travel? 录音里出现了 car（妈妈没空）、bus（太慢）、bike（最后决定）——三个都念了，只有最后那个是答案。</p>` },
 { h:'排除信号词：听到就划掉', html:`<table class="tbl"><tr><th>听到这个</th><th>意思</th></tr>
<tr><td>I was going to… / I nearly… / I almost…</td><td>差点做了 = <b>没做</b></td></tr>
<tr><td>I thought about… / We did think about…</td><td>想过 = <b>没做</b></td></tr>
<tr><td>It used to be… / It was, but…</td><td>过去如此 = <b>现在不是</b></td></tr>
<tr><td>They've moved it to… / They changed it to…</td><td>改了 = <b>后面那个才对</b></td></tr>
<tr><td>It's fully booked / It's closed / sold out</td><td>此路不通 = <b>排除</b></td></tr>
<tr><td>Let's just… / …it is, then / We've agreed on…</td><td><b>最终决定 = 答案</b></td></tr></table>` },
 { h:'两遍怎么分工', html:`<ol><li><b>第一遍</b>：不动笔，只抓"谁在说、在说什么事、问题问的是哪一点"。听完凭印象先选一个。</li><li><b>第二遍</b>：只验证你选的那个，同时确认另外两个为什么错。</li></ol><p>很多人第一遍就忙着涂答案，结果两遍都没听完整。</p>` },
 { h:'时间和数字的坑', html:`<p>一段对话里常出现三个数字，只有一个是答案。听清它跟着哪个词：</p><ul><li>"It starts at eight"（开始时间）vs "meet at half seven"（见面时间）</li><li>"was fifteen pounds"（原价）vs "I paid twelve"（实付）</li><li>"forty minutes on the motorway"（车程）vs "an hour altogether"（总共）</li></ul><p>英式口语：<b>half six = 6:30</b>（不是 5:30），<b>quarter past four = 4:15</b>，<b>quarter to four = 3:45</b>。</p>` }
]},
{ id:'L15', part:'l2', title:'听力 Part 2：六段独立录音——先读题，再听', minutes:6, sections:[
 { h:'题型长什么样', html:`<p>6 段互不相关的录音，每段之前有一句情境说明（You will hear two friends talking about a film…），然后一个问题、三个文字选项。同样放两遍。</p>` },
 { h:'听之前的 15 秒最值钱', html:`<p>每段开始前有时间读题。<b>先看问题问什么</b>，这决定了你要竖起耳朵抓哪一类信息：</p><table class="tbl"><tr><th>问题</th><th>你要抓的</th></tr>
<tr><td>What did she enjoy most?</td><td>最强的<b>正面</b>评价</td></tr>
<tr><td>What is the problem?</td><td>but 之后的<b>负面</b>信息</td></tr>
<tr><td>Why did he…?</td><td><b>原因</b>状语：because / that\'s why / it\'s my…</td></tr>
<tr><td>What will they do?</td><td><b>最后被接受</b>的提议</td></tr></table>` },
 { h:'万能结构：先铺垫，再转折', html:`<p>这部分的录音几乎都长这样：<b>先说两件不是答案的事，然后 but / though / what I… 引出答案。</b></p><p><i>"The food was lovely… It wasn\'t cheap, but I don\'t mind paying. <b>What I couldn\'t accept was</b> the waiter."</i></p><p>听到这些词就提高警觉，答案马上来：<b>but / however / though / actually / the thing is / what I… is / that\'s why</b>。</p>` },
 { h:'"别人以为"= 反向提示', html:`<p>录音里出现 <b>People assume… / Everyone expects me to say… / People think…</b>，几乎百分之百是在铺垫一个相反的答案。</p><p><i>"People think the early start is the hard part. Honestly, getting up is fine — what I find difficult is going to bed at nine."</i> → 答案是"早睡"，不是"早起"。</p>` },
 { h:'选项里的同义替换', html:`<p>正确选项很少用录音里的原词，通常是<b>换一种说法</b>：</p><ul><li>录音 "he got our order wrong twice and never apologised" → 选项 "The service was rude."</li><li>录音 "I can walk to work in eight minutes" → 选项 "the location"</li><li>录音 "I never once served a customer" → 排除 "served customers"</li></ul><p>反过来，<b>和录音用词一模一样的选项，往往是陷阱</b>。</p>` }
]},
{ id:'L16', part:'l3', title:'听力 Part 3：笔记填空——空格前后就是路标', minutes:7, sections:[
 { h:'题型长什么样', html:`<p>一段较长的独白（通知、介绍、广播），配一张笔记/表格，有 6 个空。<b>一空只填一个词或一个数字</b>。放两遍。</p>` },
 { h:'开口之前先做三件事', html:`<ol><li><b>读标题</b>：知道整段在讲什么（艺术班？慈善跑？博物馆？）。</li><li><b>看每个空前后的词</b>：它们就是录音里的路标。空前写着 "Cost each week: £___"，你就等着听 pounds a week。</li><li><b>预判词性</b>：这个空该填星期几？时间？数字？地点？还是一个物品？预判对了，听到就能立刻抓住。</li></ol>` },
 { h:'答案按顺序出现', html:`<p>这是 Part 3 最大的礼物：<b>6 个空的答案在录音里严格按顺序出现</b>。听到第 3 空的答案，就知道第 1、2 空已经过去了——别再纠结，先往下走，第二遍再补。</p><p>卡住一个空就全盘崩掉，是这部分最常见的失分方式。</p>` },
 { h:'最爱考的三种陷阱', html:`<table class="tbl"><tr><th>陷阱</th><th>例子</th><th>怎么办</th></tr>
<tr><td><b>先给旧的再给新的</b></td><td>"We did think about Mondays, but… the club will meet every Wednesday"</td><td>填后面那个</td></tr>
<tr><td><b>两个相近的数字</b></td><td>"open until five thirty, although the shop closes at five"</td><td>看空格问的是哪一个</td></tr>
<tr><td><b>题干已给一半</b></td><td>空前印着 "Mrs ___"，录音说 "speak to Mrs Patel"</td><td>只填 Patel，别重复 Mrs</td></tr></table>` },
 { h:'写法规则', html:`<ul><li>数字可以写阿拉伯数字：<b>4</b> 和 <b>four</b> 都算对。</li><li>时间写 <b>9.30</b> 或 <b>half past nine</b> 都行。</li><li>单词拼错算错——所以优先填你<b>会拼</b>的那种写法。</li><li>不要填超过一个词。题目写 "one word or a number" 就是硬规定。</li><li>实在没听出来，<b>也要猜一个</b>，空着必然 0 分。</li></ul>` }
]},
{ id:'L17', part:'l4', title:'听力 Part 4：长访谈——考的是态度，不是细节', minutes:7, sections:[
 { h:'题型长什么样', html:`<p>一段 3–4 分钟的访谈（主持人 + 一位嘉宾），6 道三选一。放两遍。这是听力里最长、最难的一部分。</p>` },
