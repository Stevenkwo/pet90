<script>
/* PET 90 — core helpers, state, speech, audio, XP */
(function(){
const PP = window.PP = {};
PP.$ = (s, r=document) => r.querySelector(s);
PP.$$ = (s, r=document) => Array.from(r.querySelectorAll(s));
PP.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
PP.h = function(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k==='text') el.textContent = v;
    else if (k==='style') el.style.cssText = v;
    else if (k==='on') for (const [e,f] of Object.entries(v)) el.addEventListener(e,f);
    else if (k==='dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};
// ---- dates
const pad = n => String(n).padStart(2,'0');
PP.today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
PP.parseDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
PP.addDays = (s,n) => { const d=PP.parseDate(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
PP.daysBetween = (a,b) => Math.round((PP.parseDate(b)-PP.parseDate(a))/86400000);
PP.fmtTime = s => { s=Math.max(0,Math.round(s)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
PP.fmtDate = s => { const d=PP.parseDate(s); return `${d.getMonth()+1}月${d.getDate()}日`; };
PP.shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
PP.rand = n => Math.floor(Math.random()*n);
PP.clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// ---- state
const KEY = 'petprep.v1';
const DEFAULT = () => ({ profile:{name:'', start:'', target:140, examDate:'', voice:''}, days:{}, results:[], speaking:[], shoot:[], srs:{}, extraCards:[], xp:0, mocks:[], activity:{}, lessonsRead:{}, fixed:{}, notes:{} });
function load(){ try { const raw=localStorage.getItem(KEY); if(!raw) return DEFAULT(); const s=JSON.parse(raw); return Object.assign(DEFAULT(), s); } catch(e){ return DEFAULT(); } }
PP.state = load();
PP.save = () => { try { localStorage.setItem(KEY, JSON.stringify(PP.state)); } catch(e){ console.warn('save failed', e); } };
PP.resetState = () => { PP.state = DEFAULT(); PP.save(); };
PP.exportState = () => JSON.stringify(PP.state, null, 1);
PP.importState = json => { const s=JSON.parse(json); if(!s||!s.profile) throw new Error('bad file'); PP.state=Object.assign(DEFAULT(), s); PP.save(); };
// 合并导入：把另一台设备的记录并进来，不覆盖本机已有的
PP.mergeState = json => {
  const inc=JSON.parse(json); if(!inc||!inc.profile) throw new Error('bad file');
  const cur=PP.state, added={阅读:0, 口语:0, 射击:0, 模考:0, 单词卡:0, 天:0};
  const keyOf = r => `${r.ts}|${r.part||''}|${r.setId||r.itemId||r.group||''}`;
  const mergeList = (name, label) => {
    const have=new Set((cur[name]||[]).map(keyOf));
    for (const r of (inc[name]||[])) if(!have.has(keyOf(r))){ cur[name].push(r); have.add(keyOf(r)); added[label]++; }
    cur[name].sort((a,b)=>a.ts-b.ts);
  };
  mergeList('results','阅读'); mergeList('speaking','口语'); mergeList('shoot','射击'); mergeList('mocks','模考');
  for (const [w,v] of Object.entries(inc.srs||{})){ const c=cur.srs[w]; if(!c || (v.seen||0)>(c.seen||0)){ cur.srs[w]=v; added.单词卡++; } }
  for (const c of (inc.extraCards||[])) if(!cur.extraCards.some(x=>x.w===c.w)) cur.extraCards.push(c);
  for (const [d,v] of Object.entries(inc.days||{})){ if(!cur.days[d]){ cur.days[d]=v; added.天++; } else { cur.days[d].done=Object.assign({}, v.done||{}, cur.days[d].done||{}); } }
  Object.assign(cur.activity, inc.activity||{});
  Object.assign(cur.lessonsRead, inc.lessonsRead||{});
  Object.assign(cur.fixed, inc.fixed||{});
  cur.xp = Math.max(cur.xp||0, inc.xp||0);
  if (!cur.profile.name && inc.profile.name) cur.profile.name = inc.profile.name;
  if (!cur.profile.start || (inc.profile.start && inc.profile.start < cur.profile.start)) cur.profile.start = inc.profile.start || cur.profile.start;
  if (!cur.profile.examDate && inc.profile.examDate) cur.profile.examDate = inc.profile.examDate;
  PP.save(); return added;
};
// ---- 录音库（IndexedDB：localStorage 存不下音频）
const AUDIO_DB='petprep-audio', AUDIO_STORE='clips', AUDIO_KEEP=80;
let _db=null;
function db(){ return new Promise((res,rej)=>{ if(_db) return res(_db); let r; try{ r=indexedDB.open(AUDIO_DB,1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains(AUDIO_STORE)) d.createObjectStore(AUDIO_STORE,{keyPath:'id'}); };
  r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); }); }
PP.audio = {
  async save(id, blob, meta){ try{ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction(AUDIO_STORE,'readwrite'); t.objectStore(AUDIO_STORE).put(Object.assign({id, blob, ts:Date.now()}, meta||{})); t.oncomplete=res; t.onerror=()=>rej(t.error); }); this.prune(); return true; }catch(e){ console.warn('audio save failed', e); return false; } },
  async get(id){ try{ const d=await db(); return await new Promise((res,rej)=>{ const t=d.transaction(AUDIO_STORE,'readonly'); const q=t.objectStore(AUDIO_STORE).get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } },
  async list(){ try{ const d=await db(); return await new Promise((res,rej)=>{ const t=d.transaction(AUDIO_STORE,'readonly'); const q=t.objectStore(AUDIO_STORE).getAll(); q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.ts-a.ts)); q.onerror=()=>rej(q.error); }); }catch(e){ return []; } },
  async remove(id){ try{ const d=await db(); await new Promise(res=>{ const t=d.transaction(AUDIO_STORE,'readwrite'); t.objectStore(AUDIO_STORE).delete(id); t.oncomplete=res; t.onerror=res; }); }catch(e){} },
  async prune(){ try{ const all=await this.list(); for(const c of all.slice(AUDIO_KEEP)) await this.remove(c.id); }catch(e){} },
  async size(){ try{ const all=await this.list(); return {n:all.length, bytes:all.reduce((a,c)=>a+((c.blob&&c.blob.size)||0),0)}; }catch(e){ return {n:0,bytes:0}; } }
};
PP.touchActivity = () => { PP.state.activity[PP.today()] = true; };
PP.streak = () => {
  const act = PP.state.activity; let d = PP.today(); let n = 0;
  if (!act[d]) d = PP.addDays(d,-1);
  while (act[d]) { n++; d = PP.addDays(d,-1); }
  return n;
};
// ---- XP & levels
PP.LEVELS = [0,120,300,550,900,1350,1900,2600,3400,4300,5300,6500,8000,10000,12500];
PP.TITLES = ['小小新手 🐣','学徒 🌱','探险家 🧭','神射手 🎯','高手 ⭐','大师 👑','传奇 🦄','宗师 🏆'];
PP.levelInfo = xp => {
  let lv=0; while (lv+1<PP.LEVELS.length && xp>=PP.LEVELS[lv+1]) lv++;
  const base=PP.LEVELS[lv], next=PP.LEVELS[Math.min(lv+1,PP.LEVELS.length-1)];
  return { level:lv+1, title:PP.TITLES[Math.min(Math.floor(lv/2), PP.TITLES.length-1)], into:xp-base, need:Math.max(1,next-base), pct: lv+1>=PP.LEVELS.length ? 100 : Math.round((xp-base)/(next-base)*100) };
};
PP.addXP = (n, why) => {
  if (!n) return;
  const before = PP.levelInfo(PP.state.xp).level;
  PP.state.xp += n; PP.touchActivity(); PP.save();
  const after = PP.levelInfo(PP.state.xp).level;
  PP.toast(`+${n} XP · ${why||''}`, 'xp');
  if (after>before) { setTimeout(()=>{ PP.toast(`🎉 升级！Lv.${after} ${PP.levelInfo(PP.state.xp).title}`, 'level'); PP.confetti(); }, 600); }
  if (PP.updateXPBar) PP.updateXPBar();
};
// ---- toast & confetti
PP.toast = (msg, kind) => {
  const root = PP.$('#toast-root'); if(!root) return;
  const t = PP.h('div', {class:'toast '+(kind||'')}, msg);
  root.append(t); requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 400); }, kind==='level'?4000:2600);
};
PP.confetti = () => {
  const colors = ['#ffb703','#e2553d','#1d7a74','#6d4fb3','#2b6cb0','#2f9e44'];
  const root = PP.h('div', {class:'confetti'});
  for (let i=0;i<60;i++){ const s=PP.h('i',{style:`left:${Math.random()*100}%;background:${colors[i%colors.length]};animation-delay:${Math.random()*0.8}s;animation-duration:${1.8+Math.random()*1.4}s;transform:rotate(${Math.random()*360}deg)`}); root.append(s); }
  document.body.append(root); setTimeout(()=>root.remove(), 3600);
};
// ---- speech synthesis
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
PP.voiceList = () => voices.filter(v => /^en/i.test(v.lang));
PP.pickVoice = () => {
  const want = PP.state.profile.voice;
  if (want){ const v = voices.find(v=>v.name===want); if (v) return v; }
  const prefs = ['Google UK English Female','Google UK English Male','Daniel','Kate','Serena','Moira','Samantha','Google US English'];
  for (const p of prefs){ const v = voices.find(v=>v.name===p); if (v) return v; }
  return voices.find(v=>/en-GB/i.test(v.lang)) || voices.find(v=>/en-US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || null;
};
PP.speak = (text, opts={}) => new Promise(res => {
  if (!window.speechSynthesis){ res(false); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = PP.pickVoice(); if (v) u.voice = v;
  u.lang = (v && v.lang) || 'en-GB'; u.rate = opts.rate || 0.92; u.pitch = 1;
  u.onend = () => res(true); u.onerror = () => res(false);
  speechSynthesis.speak(u);
});
PP.stopSpeak = () => { if (window.speechSynthesis) speechSynthesis.cancel(); };
PP.SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
// ---- tiny synth sounds
let actx = null;
function ctx(){ if(!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return actx; }
PP.beep = kind => {
  const c = ctx(); if(!c) return; const t = c.currentTime;
  const play = (type, f0, f1, dur, gain=0.08) => { const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02); };
  if (kind==='shot') play('square', 880, 220, 0.12, 0.05);
  else if (kind==='hit'){ play('triangle', 523, 1046, 0.18, 0.08); play('triangle', 659, 1318, 0.22, 0.05); }
  else if (kind==='wrong') play('sawtooth', 200, 80, 0.25, 0.07);
  else if (kind==='miss') play('sine', 300, 60, 0.4, 0.09);
  else if (kind==='ok') play('sine', 660, 990, 0.12, 0.06);
  else if (kind==='tick') play('sine', 1200, 1200, 0.03, 0.03);
};
// ---- transcript analysis helpers
PP.tokens = s => String(s||'').toLowerCase().replace(/[^a-z' ]+/g,' ').split(/\s+/).filter(Boolean);
PP.countPhrases = (text, phrases) => { const t=' '+String(text||'').toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ')+' '; let n=0; const found=[]; for (const p of phrases){ const re=new RegExp('\\b'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'); const m=t.match(re); if(m){ n+=m.length; found.push(p);} } return {n, found}; };
})();

</script>
<script>
/* PET 90 — shell: sidebar, routing, modal, mascot */
(function(){
const PP = window.PP;
PP.pages = {};
PP.route = {name:'today', params:{}};
const NAV = [
  ['today','🏠','今日任务'], ['plan','🗺️','学习地图'], ['reading','📖','阅读训练'], ['listening','🎧','听力训练'], ['speaking','🎙️','口语训练'],
  ['vocab','🃏','单词卡'], ['shoot','🚀','单词射击'], ['mock','🏆','模考'], ['history','📕','记录'], ['lessons','📚','教程'], ['progress','📈','成绩'], ['settings','⚙️','设置']
];
// ---- mascot: "Peti" the star-cat
PP.mascot = (mood='happy', size=96) => {
  const eyes = mood==='cheer'
    ? `<path d="M35 61 q9 -11 18 0" stroke="#3c3c3c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M67 61 q9 -11 18 0" stroke="#3c3c3c" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="44" cy="62" r="9" fill="#fff"/><circle cx="76" cy="62" r="9" fill="#fff"/><circle cx="46" cy="63" r="5" fill="#3c3c3c"/><circle cx="78" cy="63" r="5" fill="#3c3c3c"/><circle cx="48" cy="61" r="1.8" fill="#fff"/><circle cx="80" cy="61" r="1.8" fill="#fff"/>`
      + (mood==='think' ? `<path d="M36 50 l16 -4" stroke="#3c3c3c" stroke-width="3.5" stroke-linecap="round"/>` : '');
  const mouth = mood==='cheer' ? `<path d="M47 77 q13 16 26 0 z" fill="#3c3c3c"/><path d="M53 84 q7 6 14 0 z" fill="#ff86d0"/>`
    : mood==='think' ? `<path d="M52 82 h16" stroke="#3c3c3c" stroke-width="4" stroke-linecap="round"/>`

<script>
/* PET 90 — the 90-day plan engine */
(function(){
const PP = window.PP;
const PART_META = {
  p1:{name:'Part 1', zh:'告示与短信', desc:'5 段真实短文本，三选一', minutes:5, count:5, lesson:'L1'},
  p2:{name:'Part 2', zh:'人物配对', desc:'5 个人 ↔ 8 段短文', minutes:8, count:5, lesson:'L2'},
  p3:{name:'Part 3', zh:'长文选择', desc:'一篇长文 + 5 道四选一', minutes:8, count:5, lesson:'L3'},
  p4:{name:'Part 4', zh:'句子填空', desc:'8 句选 5 句填回文章', minutes:8, count:5, lesson:'L4'},
  p5:{name:'Part 5', zh:'词汇完形', desc:'6 空，四选一，考搭配', minutes:6, count:6, lesson:'L5'},
  p6:{name:'Part 6', zh:'语法填空', desc:'6 空，一空一词，考语法', minutes:6, count:6, lesson:'L6'}
};
const LPART_META = {
  l1:{name:'Part 1', zh:'短对话选图', desc:'7 段短对话，每段听两遍，三选一', minutes:13, count:7, lesson:'L14'},
  l2:{name:'Part 2', zh:'情境理解', desc:'6 段独立录音，每段听两遍，三选一', minutes:14, count:6, lesson:'L15'},
  l3:{name:'Part 3', zh:'笔记填空', desc:'一段独白听两遍，填 6 个空', minutes:11, count:6, lesson:'L16'},
  l4:{name:'Part 4', zh:'长访谈', desc:'一段访谈听两遍，6 道三选一', minutes:15, count:6, lesson:'L17'}
};
const SPART_META = {
  s1:{name:'Part 1', zh:'问答', desc:'个人问题，每题 15–25 秒', lesson:'L7', perSession:2, target:{minWords:15, minSec:8, maxSec:35}},
  s2:{name:'Part 2', zh:'图片描述', desc:'一张照片，独自说满 1 分钟', lesson:'L8', perSession:1, target:{minWords:70, minSec:45, maxSec:80}},
  s3:{name:'Part 3', zh:'合作讨论', desc:'和搭档讨论 5 个选项并做决定', lesson:'L9', perSession:1, target:{minWords:12, minSec:6, maxSec:30}},
  s4:{name:'Part 4', zh:'深入讨论', desc:'观点 + 理由 + 例子', lesson:'L10', perSession:1, target:{minWords:30, minSec:15, maxSec:50}}
};
const WEEKS = [
  {phase:'基础', r:['p1'],            l:['l1'], s:['s1'],                lessons:{1:'L0',2:'L1',3:'L7',4:'L14'}},
  {phase:'基础', r:['p5','p1'],       l:['l1','l2'], s:['s1','s2'],           lessons:{1:'L5',2:'L15',3:'L8'}},
  {phase:'基础', r:['p6','p5'],       l:['l2','l1'], s:['s2','s1'],           lessons:{1:'L6'}},
  {phase:'基础', r:['p2','p6'],       l:['l2','l3'], s:['s2','s1'],           lessons:{1:'L2',2:'L16',5:'L11'}},
  {phase:'提升', r:['p3','p2'],       l:['l3','l2'], s:['s3'],                lessons:{1:'L3',2:'L9'}},
  {phase:'提升', r:['p4','p3'],       l:['l4','l3'], s:['s3','s2'],           lessons:{1:'L17',2:'L4'}},
  {phase:'提升', r:['p3','p4','p5'],  l:['l3','l4','l2'], s:['s4','s3'],           lessons:{1:'L10'}},
  {phase:'提升', r:['p1','p2','p3','p4','p5','p6'], l:['l1','l2','l3','l4'], s:['s3','s4','s2','s1'], lessons:{}},
  {phase:'冲刺', r:['p3','p4','p2','p1','p5','p6'], l:['l3','l4','l1','l2'], s:['s2','s3','s4','s1'], lessons:{}},
  {phase:'冲刺', r:['p1','p2','p3','p4','p5','p6'], l:['l2','l4','l3','l1'], s:['s3','s1','s2','s4'], lessons:{}},
  {phase:'冲刺', r:['p4','p3','p6','p5','p2','p1'], l:['l4','l3','l2','l1'], s:['s4','s2','s3','s1'], lessons:{}},
  {phase:'冲刺', r:['p3','p2','p4','p1','p6','p5'], l:['l3','l1','l4','l2'], s:['s2','s4','s1','s3'], lessons:{}},
  {phase:'冲刺', r:['p1','p3','p5','p2','p4','p6'], l:['l1','l3','l2','l4'], s:['s2','s3','s4','s1'], lessons:{1:'L12'}}
];
let cache = null;
function build(){
  const D = window.PET_DATA, groups = D.wordGroups;
  const c = {p1:0,p2:0,p3:0,p4:0,p5:0,p6:0,s1:0,s2:0,s3:0,s4:0,l1:0,l2:0,l3:0,l4:0};
  const pickR = part => { const sets=D['reading_'+part]; const idx=c[part]%sets.length; const review=c[part]>=sets.length; c[part]++; return {part, setId:sets[idx].id, review}; };
  const pickL = part => { const sets=D['listening_'+part]||[]; if(!sets.length) return null; const idx=c[part]%sets.length; const review=c[part]>=sets.length; c[part]++; return {part, setId:sets[idx].id, review}; };
  const pickS = part => { const n=SPART_META[part].perSession, list=D['speaking_p'+part.slice(1)], ids=[]; for(let k=0;k<n;k++){ ids.push(list[c[part]%list.length].id); c[part]++; } return {part, ids}; };
  const days=[null];

    const w=Math.ceil(i/7), d=((i-1)%7)+1, W=WEEKS[w-1], sprint=W.phase==='冲刺';
    const plan={day:i, week:w, dow:d, phase:W.phase, lesson:(W.lessons&&W.lessons[d])||null, listening:null, reading:[], speaking:null, shoot:{group:groups[(i-1)%groups.length].id}, vocab:10, review:false, readingMock:false, speakingMock:false};

      if (sprint && d%2===1){ plan.reading.push(pickR(W.r[((d-1)*2)%W.r.length])); plan.reading.push(pickR(W.r[((d-1)*2+1)%W.r.length])); }
      else plan.reading.push(pickR(W.r[(d-1)%W.r.length]));
      plan.speaking = pickS(W.s[(d-1)%W.s.length]);
    } else if (d===6){
      plan.listening = pickL(W.l[5%W.l.length]);
      if (sprint) plan.readingMock=true; else plan.reading.push(pickR(W.r[W.r.length-1]));
      plan.speaking = pickS(W.s[5%W.s.length]);
    } else { plan.review=true; if (sprint) plan.speakingMock=true; }
    days.push(plan);
  }
  return days;
}
PP.PLAN = {
  PART_META, SPART_META, LPART_META, WEEKS,
  all(){ if(!cache) cache=build(); return cache; },
  dayPlan(i){ const all=this.all(); if (i>=1 && i<=90) return all[i]; return this.freePlan(i); },
  freePlan(i){ // after day 90 (or before start): rotate everything
    const D=window.PET_DATA, groups=D.wordGroups, k=Math.abs(i);
    const parts=['p1','p2','p3','p4','p5','p6'], sp=['s1','s2','s3','s4'];
    const part=parts[k%6], sets=D['reading_'+part]; const s=sp[k%4], list=D['speaking_p'+s.slice(1)];
    const lps=['l1','l2','l3','l4']; const lp=lps[k%4]; const lsets=D['listening_'+lp]||[];
    return {day:i, week:Math.ceil(i/7), dow:((i-1)%7+7)%7+1, phase:'自由', lesson:null, listening:lsets.length?{part:lp, setId:lsets[k%lsets.length].id, review:true}:null, reading:[{part, setId:sets[k%sets.length].id, review:true}], speaking:{part:s, ids:[list[k%list.length].id]}, shoot:{group:groups[k%groups.length].id}, vocab:10, review:false, readingMock:false, speakingMock:false, free:true};
  },
  todayIndex(){ const st=PP.state.profile.start; if(!st) return 1; return PP.daysBetween(st, PP.today())+1; },
  tasksOf(plan){
    const t=[];
    if (plan.listening){ const m=LPART_META[plan.listening.part]; t.push({key:'listening:'+plan.listening.setId, kind:'listening', part:plan.listening.part, setId:plan.listening.setId, label:`听力 ${m.name} · ${m.zh}${plan.listening.review?'（复习）':''}`, minutes:m.minutes}); }
    if (plan.lesson) t.push({key:'lesson', kind:'lesson', label:'教程：'+(PET_DATA.lessons.find(l=>l.id===plan.lesson)||{}).title, minutes:(PET_DATA.lessons.find(l=>l.id===plan.lesson)||{}).minutes||6, lesson:plan.lesson});
    for (const r of plan.reading){ const m=PART_META[r.part]; t.push({key:'reading:'+r.setId, kind:'reading', part:r.part, setId:r.setId, label:`阅读 ${m.name} · ${m.zh}${r.review?'（复习）':''}`, minutes:m.minutes+2}); }
    if (plan.readingMock) t.push({key:'mock:reading', kind:'mockReading', label:'阅读全卷模考（45 分钟 · 32 题）', minutes:45});
    if (plan.speaking){ const m=SPART_META[plan.speaking.part]; t.push({key:'speaking', kind:'speaking', part:plan.speaking.part, ids:plan.speaking.ids, label:`口语 ${m.name} · ${m.zh}`, minutes:8}); }
    if (plan.speakingMock) t.push({key:'mock:speaking', kind:'mockSpeaking', label:'口语完整模拟（四部分连做）', minutes:15});
    if (plan.review){ t.push({key:'review:listening', kind:'reviewListening', label:'复盘：重听本周最弱的一段听力', minutes:7}); t.push({key:'review:reading', kind:'reviewReading', label:'复盘：重做本周最弱的一组阅读', minutes:8}); if(!plan.speakingMock) t.push({key:'review:speaking', kind:'reviewSpeaking', label:'复盘：回听本周口语录音并自评', minutes:6}); }
    t.push({key:'vocab', kind:'vocab', label:'单词卡 10 张（间隔复习）', minutes:4});
    t.push({key:'shoot', kind:'shoot', group:plan.shoot.group, label:`单词射击 · 字母 ${plan.shoot.group}`, minutes:5});
    return t;
  },
  isDone(day, key){ const d=PP.state.days[day]; return !!(d && d.done && d.done[key]); },
  markDone(day, key, extra){ const s=PP.state; s.days[day]=s.days[day]||{done:{}}; s.days[day].done=s.days[day].done||{}; if(!s.days[day].done[key]){ s.days[day].done[key]=PP.today(); } if(extra) Object.assign(s.days[day], extra); PP.touchActivity(); PP.save(); },
  dayProgress(day){ const plan=this.dayPlan(day), tasks=this.tasksOf(plan); const done=tasks.filter(t=>this.isDone(day,t.key)).length; return {done, total:tasks.length, tasks, plan}; }
};
})();

<script>
/* PET 90 — Reading: renderers for 6 parts, single-part runner, chooser page */
(function(){

  p2:{en:'Decide which text (A–H) would be the most suitable for each person (1–5).', zh:'左边 5 个人各有 3 个条件，右边 8 段短文只有 5 段合适。三条件全满足才能选。'},

  p4:{en:'Five sentences have been removed from the text. For each gap, choose the correct sentence (A–H). There are three extra sentences.', zh:'看空格前后句的指代词（she / this / them）和连接词（but / though / also）。3 句是多余的。'},

function selectIn(group, el){ group.forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
function markMC(opts, chosen, correct){ opts.forEach((o,i)=>{ o.classList.remove('sel'); if(i===correct) o.classList.add('correct'); else if(i===chosen) o.classList.add('wrong'); o.style.pointerEvents='none'; }); }
// ---------- Part 1
function renderP1(set, root){
  const items = set.items.map((it,qi)=>{
    const opts = it.options.map((o,i)=>optRow(LET[i], o));
    opts.forEach((o,i)=>o.addEventListener('click',()=>{ selectIn(opts,o); state[qi]=i; }));

    collect:()=>state.slice(), count:5,
    grade:(ans)=>{ let s=0; const detail=set.answers.map((a,i)=>{ const ok=ans[i]===a; if(ok) s++; return {ok, chosen:ans[i], correct:a}; }); return {score:s,total:5,detail}; },
    showResults:(ans)=>{ set.answers.forEach((a,i)=>{ const ok=ans[i]===a; sels[i].classList.add(ok?'correct':'wrong'); sels[i].disabled=true; sels[i].parentElement.parentElement.append(h('div',{class:'why'}, h('b',{}, ok?'✅ ':'❌ 正确答案 '+a+'  '), set.why[i])); }); }

}
// ---------- Part 3
function renderP3(set, root){
  const state = new Array(set.questions.length).fill(null);
  const qs = set.questions.map((q,qi)=>{ const opts=q.options.map((o,i)=>optRow(LET[i],o)); opts.forEach((o,i)=>o.addEventListener('click',()=>{ selectIn(opts,o); state[qi]=i; })); const box=h('div',{class:'q'}, h('div',{class:'qt'}, h('span',{class:'qn'},qi+1), q.q), ...opts); return {opts, box}; });

}
// ---------- Part 4
function renderP4(set, root){

const norm = s => String(s||'').toLowerCase().trim().replace(/[.,!?;:"“”]+$/,'').replace(/^["“”']+/,'').replace(/’/g,"'");

READ.renderPart = (part, set, root, opts) => ({p1:renderP1,p2:renderP2,p3:renderP3,p4:renderP4,p5:renderP5,p6:renderP6}[part])(set, root, opts||{});

READ.scoreClass = pct => pct>=85?'good':pct>=70?'mid':'bad';
// ---------- runner
READ.run = ({part, setId, mode='free', day=null, onDone=null, back=null}) => {
  const set = READ.getSet(part, setId), meta = M()[part], c = PP.main; c.innerHTML='';
  const timer = PP.timerEl();
  const head = h('div',{class:'runner-head'}, h('div',{}, h('div',{class:'row gap'}, h('span',{class:'pill read'},'Reading '+meta.name), h('span',{class:'pill'}, meta.zh), mode==='daily'?h('span',{class:'pill accent'},'今日任务'):null), h('h2',{class:'mt', style:'margin-top:6px'}, set.title||meta.zh)), h('div',{class:'row gap'}, h('span',{class:'small muted'}, `建议 ${meta.minutes} 分钟`), timer.el, h('button',{class:'btn btn-ghost btn-sm', on:{click:()=>leave()}},'退出')));
  const instr = h('div',{class:'instr'}, h('b',{}, READ.INSTR[part].en), h('div',{class:'small muted mt', style:'margin-top:4px'}, READ.INSTR[part].zh));
  const body = h('div');

      const rec = {ts:Date.now(), day, mode, part, setId, score:g.score, total:g.total, secs:Math.round(secs), wrong:g.detail.map((d,i)=>d.ok?null:i).filter(x=>x!==null), answers:ans.map(a=>a===null||a===undefined?'':a)};
      // 订正标记：这一题以前错过（本机记录或合并进来的都算），这次做对 → 标为已订正
      const everWrong = new Set();
      for (const r of PP.state.results) if (r.part===part && r.setId===setId && r.wrong) for (const wi of r.wrong) everWrong.add(wi);
      g.detail.forEach((d,i)=>{ const k=`${part}|${setId}|${i}`;
        if (!d.ok) { PP.state.fixed[k]=0; }
        else if (everWrong.has(i) || PP.state.fixed[k]!==undefined) { PP.state.fixed[k]=Date.now(); }
      });
      PP.state.results.push(rec); PP.save();
      const xp = 20 + Math.round(pct/100*20); PP.addXP(xp, `阅读 ${meta.name}`);
      ctrl.showResults(ans); submit.remove();
      const est = pct>=90?'🏆 Distinction 水平':pct>=85?'🥈 Merit 水平':pct>=70?'✅ 通过线以上':pct>=55?'⚠️ 接近及格线':'📚 继续打基础';
      const box = h('div',{class:'result-box'}, h('div',{class:'big'}, `${g.score}`, h('small',{},` / ${g.total}`)), h('div',{}, h('div',{class:'bold', style:'font-size:18px'}, `${pct}% · ${est}`), h('div',{class:'small', style:'opacity:.8'}, `用时 ${PP.fmtTime(secs)}（建议 ${meta.minutes} 分钟）· +${xp} XP`)));
      foot.append(box);
      const btns = h('div',{class:'row gap wrap'});
      if (onDone) btns.append(h('button',{class:'btn btn-primary btn-lg', on:{click:()=>{ onDone(rec); }}},'完成，返回今日 →'));
      else btns.append(h('button',{class:'btn btn-primary btn-lg', on:{click:()=>leave()}},'返回'));
      btns.append(h('button',{class:'btn', on:{click:()=>READ.run({part,setId,mode,day,onDone,back})}},'再做一次'));
      const sets=READ.getSets(part); const idx=sets.findIndex(s=>s.id===setId); if(mode!=='daily' && idx<sets.length-1) btns.append(h('button',{class:'btn', on:{click:()=>READ.run({part,setId:sets[idx+1].id,mode,back})}},'下一组 →'));
      if (meta.lesson) btns.append(h('button',{class:'btn btn-ghost', on:{click:()=>PP.navigate('lessons',{id:meta.lesson})}},'📚 看这部分的方法'));
      foot.append(btns); box.scrollIntoView({behavior:'smooth', block:'center'});
    };
    if (blank>0) PP.confirm(`还有 ${blank} 题没作答，确定提交吗？`, go); else go();
  });
};
// ---------- chooser page
PP.pages.reading = (c, params={}) => {

  }

  c.append(h('div',{class:'row gap mt'}, h('button',{class:'btn btn-read', on:{click:()=>{ const part=['p1','p2','p3','p4','p5','p6'][PP.rand(6)]; const sets=READ.getSets(part); READ.run({part, setId:sets[PP.rand(sets.length)].id, mode:'free'}); }}},'🎲 随机来一组'), h('button',{class:'btn', on:{click:()=>PP.navigate('lessons')}},'📚 先看阅读方法')));

<script>
/* PET 90 — 听力：四个部分 + TTS 双人播放器 */
(function(){
const PP=window.PP, D=window.PET_DATA, h=PP.h;
const LIS = PP.LISTEN = {};
const LET='ABC';

LIS.getSets = part => D['listening_'+part] || [];
LIS.getSet = (part,id) => LIS.getSets(part).find(s=>s.id===id);

LIS.INSTR = {
  l1:'听 7 段短对话，每段回答一个问题，三选一。每段可以听两遍——真考也是两遍。',
  l2:'听 6 段互不相关的录音，每段先有情境说明，再选答案。三个选项通常都会被提到，听清"问的是什么"。',
  l3:'听一段较长的独白，把笔记上的空填完整。一空只填一个词或一个数字。',
  l4:'听一段访谈，回答 6 道题。题目顺序和录音顺序一致，多半问观点和原因，不只是细节。'
};

// ---------- 语音挑选：男/女两个不同的声音，优先英式
let VOICE_CACHE=null;
function pickVoices(){
  if (VOICE_CACHE) return VOICE_CACHE;
  const all=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(!all.length) return {M:null,F:null,N:null};
  const en=all.filter(v=>/^en[-_]/i.test(v.lang));
  const gb=en.filter(v=>/en[-_]GB/i.test(v.lang));
  const pool=gb.length>=2?gb:(en.length?en:all);
  const find=names=>pool.find(v=>names.some(n=>v.name.toLowerCase().includes(n)));
  let M=find(['daniel','reed','rocko','arthur','george','oliver','male']);
  let F=find(['sandy','shelley','flo','kate','serena','martha','female','samantha']);
  if(!M) M=pool[0];
  if(!F) F=pool.find(v=>v!==M)||pool[1]||M;
  if(F===M && pool.length>1) F=pool[1];
  VOICE_CACHE={M, F, N:M};
  return VOICE_CACHE;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{ VOICE_CACHE=null; };
LIS._voices = pickVoices;
LIS.rate = () => PP.state.profile.listenRate || 0.9;
LIS.setRate = r => { PP.state.profile.listenRate=r; PP.save(); };

// 长句拆成短句：Chrome 对超长 utterance 会中途掐断
function chunk(text){
  if (text.length<=180) return [text];
  const out=[]; let cur='';
  for (const s of text.split(/(?<=[.!?])\s+/)){
    if ((cur+' '+s).trim().length>180 && cur){ out.push(cur.trim()); cur=s; }
    else cur=(cur?cur+' ':'')+s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
// 顺序朗读；不在中途 cancel，否则队列会断
function speakSequence(lines, {rate, onLine, onEnd}){
  const V=pickVoices(); let stopped=false, idx=0;
  const queue=[];
  lines.forEach((l,li)=>chunk(l.t).forEach((t,ci)=>queue.push({t, sp:l.sp, li, first:ci===0})));
  let keepAlive=null;
  function cleanup(){ if(keepAlive){ clearInterval(keepAlive); keepAlive=null; } }
  function next(){
    if (stopped) return;
    if (idx>=queue.length){ cleanup(); onEnd&&onEnd(); return; }
    const q=queue[idx];
    const u=new SpeechSynthesisUtterance(q.t);
    u.voice = V[q.sp] || V.N || null;
    u.lang = (u.voice&&u.voice.lang) || 'en-GB';
    u.rate = rate; u.pitch = q.sp==='F'?1.06:0.96;
    u.onend = ()=>{ idx++; setTimeout(next, q.first?60:40); };
    u.onerror = ()=>{ idx++; setTimeout(next, 40); };
    if (q.first && onLine) onLine(q.li);
    try { speechSynthesis.speak(u); } catch(e){ idx++; setTimeout(next,40); }
  }
  try{ speechSynthesis.cancel(); }catch(e){}
  // Chrome ~15s 掐断的老毛病：定时 resume 兜住
  keepAlive=setInterval(()=>{ if(!stopped && speechSynthesis.speaking && !speechSynthesis.paused){ try{ speechSynthesis.pause(); speechSynthesis.resume(); }catch(e){} } }, 9000);
  setTimeout(next, 120);
  return { stop(){ stopped=true; cleanup(); try{ speechSynthesis.cancel(); }catch(e){} } };
}

// ---------- 播放器组件
LIS.player = ({script, intro, compact=false, onPlayed=null}) => {
  let handle=null, plays=0, playing=false;
  const lines = intro ? [{sp:'N', t:intro}].concat(script) : script.slice();
  const count = h('span',{class:'play-count'},'未播放');
  const btn = h('button',{class:'btn btn-lg btn-listen play-btn'}, h('span',{class:'pi'},'▶'), h('span',{class:'pl'}, compact?'播放':'播放录音'));
  const wave = h('div',{class:'wave'}, ...Array.from({length:14},()=>h('i')));
  const el = h('div',{class:'player'+(compact?' compact':'')}, h('div',{class:'row gap center'}, btn, wave, count));
  function setPlaying(on){
    playing=on; el.classList.toggle('on', on);
    btn.querySelector('.pi').textContent = on?'■':'▶';
    btn.querySelector('.pl').textContent = on?'停止':(plays?'再听一遍':(compact?'播放':'播放录音'));
  }
  function stop(){ if(handle) handle.stop(); handle=null; setPlaying(false); }
  btn.addEventListener('click', ()=>{
    if (playing){ stop(); return; }
    document.querySelectorAll('.player.on .play-btn').forEach(b=>{ if(b!==btn) b.click(); });
    setPlaying(true);
    handle = speakSequence(lines, { rate:LIS.rate(),
      onEnd:()=>{ plays++; count.textContent=`已听 ${plays} 遍`; count.classList.toggle('twice', plays>=2); setPlaying(false); onPlayed&&onPlayed(plays); } });
  });
  return { el, stop, get plays(){ return plays; } };
};
// 速度条
LIS.speedBar = () => {
  const opts=[['0.75','慢'],['0.9','正常'],['1','原速']];
  const seg=h('div',{class:'seg small-seg'}, ...opts.map(([v,l])=>h('button',{class:String(LIS.rate())===v?'on':'', on:{click:e=>{ LIS.setRate(+v); seg.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); }}}, l)));
  return h('div',{class:'row gap center wrap'}, h('span',{class:'small muted'},'语速'), seg, h('span',{class:'small muted'},'· 听不清就调慢，考前练回原速'));
};

// ---------- 答案比对（Part 3 填空）
const norm = s => String(s||'').toLowerCase().trim().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');
LIS.checkGap = (input, answers) => { const v=norm(input); return answers.some(a=>norm(a)===v); };

function optRow(letter, text){ return h('div',{class:'opt'}, h('span',{class:'letter'},letter), h('span',{},text)); }
function selectIn(list, el){ list.forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }

// ---------- Part 1：短对话 + 图标三选一
function renderL1(set, root){
  const state=new Array(set.items.length).fill(null); const players=[]; const boxes=[];
  set.items.forEach((it,qi)=>{
    const p=LIS.player({script:it.script, compact:true}); players.push(p);
    const cards=it.options.map((o,i)=>h('div',{class:'pic-opt'}, h('div',{class:'pe'},o.emoji), h('div',{class:'pl'}, LET[i]+'. '+o.label)));
    cards.forEach((c,i)=>c.addEventListener('click',()=>{ cards.forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); state[qi]=i; }));
    const box=h('div',{class:'q lq'}, h('div',{class:'qt'}, h('span',{class:'qn'},qi+1), it.q), p.el, h('div',{class:'pic-opts'}, ...cards));
    boxes.push({box, cards}); root.append(box);
  });
  return { answers:()=>state, stop:()=>players.forEach(p=>p.stop()),
    grade(ans){ const detail=set.items.map((it,i)=>({ok:ans[i]===it.answer, correct:it.answer, chosen:ans[i]}));
      detail.forEach((d,i)=>{ const {cards}=boxes[i]; cards.forEach((c,k)=>{ c.classList.remove('sel'); if(k===set.items[i].answer) c.classList.add('correct'); else if(k===ans[i]) c.classList.add('wrong'); });
        boxes[i].box.append(h('div',{class:'why'}, h('b',{},'为什么　'), set.items[i].why), scriptBox(set.items[i].script)); });
      return {score:detail.filter(d=>d.ok).length, total:detail.length, detail}; } };
}
// ---------- Part 2：情境 + 文字三选一
function renderL2(set, root){
  const state=new Array(set.items.length).fill(null); const players=[]; const boxes=[];
  set.items.forEach((it,qi)=>{
    const p=LIS.player({script:it.script, intro:it.intro, compact:true}); players.push(p);
    const opts=it.options.map((o,i)=>optRow(LET[i],o));
    opts.forEach((o,i)=>o.addEventListener('click',()=>{ selectIn(opts,o); state[qi]=i; }));
    const box=h('div',{class:'q lq'}, h('div',{class:'lead'}, '🔈 '+it.intro), h('div',{class:'qt'}, h('span',{class:'qn'},qi+1), it.q), p.el, ...opts);
    boxes.push({box,opts}); root.append(box);
  });
  return { answers:()=>state, stop:()=>players.forEach(p=>p.stop()),
    grade(ans){ const detail=set.items.map((it,i)=>({ok:ans[i]===it.answer, correct:it.answer, chosen:ans[i]}));
      detail.forEach((d,i)=>{ const {opts}=boxes[i]; opts.forEach((o,k)=>{ o.classList.remove('sel'); if(k===set.items[i].answer) o.classList.add('correct'); else if(k===ans[i]) o.classList.add('wrong'); });
        boxes[i].box.append(h('div',{class:'why'}, h('b',{},'为什么　'), set.items[i].why), scriptBox(set.items[i].script, set.items[i].intro)); });
      return {score:detail.filter(d=>d.ok).length, total:detail.length, detail}; } };
}
// ---------- Part 3：独白 + 笔记填空
function renderL3(set, root){
  const inputs=[];
  const p=LIS.player({script:set.script, intro:set.intro});
  const note=h('div',{class:'note-card'}, h('div',{class:'note-head'}, h('span',{class:'ni'}, set.noteIcon||'📝'), set.noteTitle));
  set.lines.forEach(l=>{
    const row=h('div',{class:'note-line'}, h('span',{class:'nl'}, l.label));
    if (l.gap!==undefined){
      const wrap=h('span',{class:'nv'});
      if (l.prefix) wrap.append(h('span',{class:'fix'}, l.prefix));
      const inp=h('input',{class:'gap-input', type:'text', autocomplete:'off', spellcheck:'false', placeholder:'…'});
      inputs[l.gap]=inp; wrap.append(h('span',{class:'gnum'}, l.gap+1), inp);
      if (l.suffix) wrap.append(h('span',{class:'fix'}, l.suffix));
      row.append(wrap);
    } else row.append(h('span',{class:'nv fixed'}, l.fixed||''));
    note.append(row);
  });
  root.append(h('div',{class:'card tight'}, p.el, LIS.speedBar()), note);
  return { answers:()=>inputs.map(i=>i.value), stop:()=>p.stop(),
    grade(ans){ const detail=set.gaps.map((g,i)=>({ok:LIS.checkGap(ans[i],g.answer), correct:g.answer[0], chosen:ans[i]}));
      detail.forEach((d,i)=>{ const inp=inputs[i]; inp.disabled=true; inp.classList.add(d.ok?'ok':'bad');
        if(!d.ok) inp.parentNode.append(h('span',{class:'fix corr'},'→ '+set.gaps[i].answer[0])); });
      root.append(h('div',{class:'card tight'}, h('h3',{class:'mb'},'逐空解析'), ...set.gaps.map((g,i)=>h('div',{class:'why'}, h('b',{},`空 ${i+1} · ${g.answer[0]}　`), g.why))), scriptBox(set.script, set.intro));
      return {score:detail.filter(d=>d.ok).length, total:detail.length, detail}; } };
}
// ---------- Part 4：访谈 + 6 道三选一
function renderL4(set, root){
  const state=new Array(set.questions.length).fill(null); const boxes=[];
  const p=LIS.player({script:set.script, intro:set.intro});
  root.append(h('div',{class:'card tight'}, h('div',{class:'lead'}, '🔈 '+set.intro), p.el, LIS.speedBar()));
  set.questions.forEach((q,qi)=>{
    const opts=q.options.map((o,i)=>optRow(LET[i],o));
    opts.forEach((o,i)=>o.addEventListener('click',()=>{ selectIn(opts,o); state[qi]=i; }));
    const box=h('div',{class:'q lq'}, h('div',{class:'qt'}, h('span',{class:'qn'},qi+1), q.q), ...opts);
    boxes.push({box,opts}); root.append(box);
  });
  return { answers:()=>state, stop:()=>p.stop(),
    grade(ans){ const detail=set.questions.map((q,i)=>({ok:ans[i]===q.answer, correct:q.answer, chosen:ans[i]}));
      detail.forEach((d,i)=>{ const {opts}=boxes[i]; opts.forEach((o,k)=>{ o.classList.remove('sel'); if(k===set.questions[i].answer) o.classList.add('correct'); else if(k===ans[i]) o.classList.add('wrong'); });
        boxes[i].box.append(h('div',{class:'why'}, h('b',{},'为什么　'), set.questions[i].why)); });
      root.append(scriptBox(set.script, set.intro));
      return {score:detail.filter(d=>d.ok).length, total:detail.length, detail}; } };
}
// 听力原文（只在判分后出现）
function scriptBox(script, intro){
  const body=h('div',{class:'script-body'});
  if (intro) body.append(h('p',{class:'nar'}, intro));
  script.forEach(l=>body.append(h('p',{}, h('b',{class:'sp sp-'+l.sp}, l.sp==='F'?'女':l.sp==='M'?'男':'旁白'), l.t)));
  const box=h('details',{class:'script-box'}, h('summary',{},'📄 听力原文'), body);
  return box;
}

LIS.renderPart = (part, set, root) => ({l1:renderL1,l2:renderL2,l3:renderL3,l4:renderL4}[part])(set, root);
LIS.resultsFor = (part, setId) => PP.state.results.filter(r=>r.part===part && (!setId || r.setId===setId));
LIS.best = (part, setId) => { const rs=LIS.resultsFor(part,setId); if(!rs.length) return null; return Math.max(...rs.map(r=>Math.round(r.score/r.total*100))); };

// ---------- 一次练习
LIS.run = ({part, setId, mode='free', day=null, onDone=null, back=null}) => {
  const set = LIS.getSet(part, setId), meta = PP.PLAN.LPART_META[part], c = PP.main; c.innerHTML='';
  let ctrl=null, done=false;
  const body = h('div',{class:'qs'});
  const head = h('div',{class:'row between wrap gap mb'},
    h('div',{class:'row gap wrap'}, h('span',{class:'pill listen'},'听力'), h('span',{class:'pill'}, meta.name+' · '+meta.zh), h('span',{class:'pill'}, set.title), mode==='review'?h('span',{class:'pill warn'},'复盘'):null),
    h('div',{class:'row gap'}, LIS.best(part,setId)!==null?h('span',{class:'small muted'},'最好 '+LIS.best(part,setId)+'%'):h('span',{class:'small muted'},'首次'),
      h('button',{class:'btn btn-sm btn-ghost', on:{click:()=>{ if(ctrl) ctrl.stop(); PP.stopSpeak(); back?PP.navigate(back.page,back.params):PP.navigate('listening'); }}},'退出')));
  const instr = h('div',{class:'instr'}, '🎧 ', LIS.INSTR[part], h('span',{class:'muted'},' 判分前不显示原文——先用耳朵。'));
  const submit = h('button',{class:'btn btn-primary btn-lg'},'提交答案 ✓');
  const foot = h('div',{class:'row gap wrap mt'}, submit, h('button',{class:'btn', on:{click:()=>PP.navigate('lessons',{id:meta.lesson})}},'📚 这部分怎么听'));
  c.append(head, instr, body, foot);
  ctrl = LIS.renderPart(part, set, body);
  if (part==='l1'||part==='l2') c.insertBefore(h('div',{class:'card tight'}, LIS.speedBar()), body);
  submit.addEventListener('click', ()=>{
    if (done){ back?PP.navigate(back.page,back.params):PP.navigate('listening'); return; }
    const ans=ctrl.answers();
    const blank = part==='l3' ? ans.filter(a=>!String(a).trim()).length : ans.filter(a=>a===null).length;
    if (blank && !confirm(`还有 ${blank} 题没作答，确定提交吗？`)) return;
    ctrl.stop(); PP.stopSpeak(); done=true;
    const g=ctrl.grade(ans), pct=Math.round(g.score/g.total*100);
    const rec={ts:Date.now(), day, mode, part, setId, score:g.score, total:g.total, secs:0,
      wrong:g.detail.map((d,i)=>d.ok?null:i).filter(x=>x!==null),
      answers:ans.map(a=>a===null||a===undefined?'':a)};
    const everWrong=new Set();
    for (const r of PP.state.results) if (r.part===part && r.setId===setId && r.wrong) for (const wi of r.wrong) everWrong.add(wi);
    g.detail.forEach((d,i)=>{ const k=`${part}|${setId}|${i}`; if(!d.ok) PP.state.fixed[k]=0; else if(everWrong.has(i)||PP.state.fixed[k]!==undefined) PP.state.fixed[k]=Date.now(); });
    PP.state.results.push(rec);
    const xp = 10 + Math.round(pct/100*20);
    PP.addXP(xp); PP.save();
    if (day!=null) PP.PLAN.markDone(day, 'listening:'+setId);
    submit.textContent='完成，返回 →';
    const card=h('div',{class:'result-card '+(pct>=85?'good':pct>=70?'mid':'bad')},
      PP.say(pct>=85?'耳朵很准！':pct>=70?'不错，再多听一遍原文。':'别急，听力是练出来的——把原文跟读一遍。', pct>=70?'happy':'think', 76),
      h('div',{class:'big'}, g.score+' / '+g.total), h('div',{class:'pct'}, pct+'%'), h('div',{class:'small'},'+'+xp+' XP'));
    c.insertBefore(card, body); card.scrollIntoView({behavior:'smooth',block:'center'});
    if (onDone) onDone(rec);
  });
};

// ---------- 列表页
PP.pages.listening = (c, params={}) => {
  const M=PP.PLAN.LPART_META;
  c.append(PP.pageHead('听力训练','PET 听力四个部分。录音由电脑朗读，可调语速、可反复听——真考每段放两遍。'));
  c.append(h('div',{class:'instr'},'🎧 建议：第一遍不看任何文字，只听；答完题再看原文。原文只在判分后出现。'));
  c.append(h('div',{class:'card tight'}, LIS.speedBar()));
  for (const part of ['l1','l2','l3','l4']){
    const m=M[part], sets=LIS.getSets(part);
    const rows=sets.map(s=>{
      const best=LIS.best(part,s.id), n=LIS.resultsFor(part,s.id).length;
      return h('div',{class:'set-row', on:{click:()=>LIS.run({part, setId:s.id})}},
        h('span',{class:'ic listen'},'🎧'), h('span',{class:'t'}, s.title, h('div',{class:'small muted', style:'font-weight:600'}, n?`练过 ${n} 次`:'未练过')),
        best!==null?h('span',{class:'score '+(best>=85?'good':best>=70?'mid':'bad')}, best+'%'):h('span',{class:'small muted'},'—'),
        h('span',{class:'go'},'→'));
    });
    c.append(h('div',{class:'card'},
      h('div',{class:'row between wrap gap mb'}, h('div',{}, h('h3',{}, m.name+' · '+m.zh), h('p',{class:'small muted'}, m.desc)),
        h('button',{class:'btn btn-sm', on:{click:()=>PP.navigate('lessons',{id:m.lesson})}},'📚 方法')),
      h('div',{class:'set-list'}, ...rows)));
  }
};
})();

</script>
<script>
/* PET 90 — Speaking: recorder (SpeechRecognition + MediaRecorder), analysis, runners for 4 parts, chooser */
(function(){
const PP=window.PP, D=window.PET_DATA, h=PP.h, SM=()=>PP.PLAN.SPART_META;
const SPEAK = PP.SPEAK = {};
const FILLERS=['um','uh','er','erm','hmm','ah'];
const LINKERS=['because','so','but','and then','for example','also','however','although','which','when','if','especially','instead'];
const OPINION=["i think","in my opinion","i prefer","i believe","i agree","i'm not sure","i don't think","what about","shall we","let's","what do you think","don't you think","that's true","good idea","i'd like","i would like"];
const POSITION=['on the left','on the right','in the middle','in the background','in the front','next to','behind','in front of','at the top','at the bottom','above','below'];
const GUESS=['i think','maybe','probably','perhaps','looks like','it looks','seems','might be','must be'];
// ---------- analysis
SPEAK.analyze = (text, secs, part, item) => {
  const toks = PP.tokens(text), words=toks.length, wpm = secs>0?Math.round(words/secs*60):0;
  const t = SM()[part].target; const notes=[]; let score=3;
  let rep=0; for(let i=1;i<toks.length;i++) if(toks[i]===toks[i-1]) rep++;
  const fillers = toks.filter(x=>FILLERS.includes(x)).length + rep;
  const linkers = PP.countPhrases(text, LINKERS), opinion = PP.countPhrases(text, OPINION), pos = PP.countPhrases(text, POSITION), guess = PP.countPhrases(text, GUESS);
  if (words===0){ return {words:0,wpm:0,secs,fillers:0,score:1,notes:[{k:'warn',t:'没有识别到内容。检查麦克风，或用“手动输入”把你说的话打出来。'}],checklist:[]}; }
  if (words >= t.minWords){ score++; notes.push({k:'ok',t:`长度达标：${words} 个词（目标 ≥ ${t.minWords}）`}); }
  else if (words < t.minWords*0.5){ score--; notes.push({k:'warn',t:`太短了：只有 ${words} 个词，目标 ≥ ${t.minWords}。用 A+R+E：回答 + 原因 + 例子。`}); }
  else notes.push({k:'warn',t:`再多说一点：${words} 个词，目标 ≥ ${t.minWords}`});
  if (secs < t.minSec) notes.push({k:'warn',t:`时长 ${Math.round(secs)} 秒，太快结束了（目标 ${t.minSec}–${t.maxSec} 秒）`});
  else if (secs > t.maxSec*1.3) notes.push({k:'tip',t:`时长 ${Math.round(secs)} 秒，有点长；考试里考官会打断。`});
  else notes.push({k:'ok',t:`时长 ${Math.round(secs)} 秒，节奏合适`});
  if (wpm && wpm<70) notes.push({k:'tip',t:`语速 ${wpm} 词/分钟偏慢，先说熟范例再录一次。`}); else if (wpm>170) notes.push({k:'tip',t:`语速 ${wpm} 词/分钟偏快，考官可能听不清。`});
  if (fillers>4){ score--; notes.push({k:'warn',t:`口头禅/重复 ${fillers} 次（um / er / 重复词）。停顿比 um 好。`}); }
  let checklist=[];
  if (part==='s1' || part==='s4'){
    if (linkers.n>=2){ score++; notes.push({k:'ok',t:`用了连接词：${linkers.found.join(', ')}`}); }
    else if (linkers.n===1) notes.push({k:'tip',t:`只用了 1 个连接词（${linkers.found[0]}），再加一个 because / for example / but。`});
    else { score--; notes.push({k:'warn',t:'没有 because / so / but / for example —— 考官听不到你的“理由”和“例子”。'}); }
    if (part==='s4'){ if (opinion.n>=1) notes.push({k:'ok',t:`有观点句：${opinion.found.slice(0,2).join(', ')}`}); else notes.push({k:'tip',t:'试试以 I think… / In my opinion… 开头。'}); }
  }
  if (part==='s2' && item && item.checklist){
    checklist = item.checklist.map(ch=>{ const r=PP.countPhrases(text, ch.keys); return {label:ch.label, hit:r.n>0, found:r.found.slice(0,3)}; });
    const hits = checklist.filter(c=>c.hit).length;
    if (hits>=5){ score++; notes.push({k:'ok',t:`六步框架覆盖 ${hits}/6 ✔`}); } else if (hits>=3) notes.push({k:'tip',t:`六步框架覆盖 ${hits}/6，缺：${checklist.filter(c=>!c.hit).map(c=>c.label).join('、')}`}); else { score--; notes.push({k:'warn',t:`只覆盖了 ${hits}/6 步。用框架：总体 → 人物位置 → 动作 -ing → 衣着/物品/天气 → 猜测 → 感受。`}); }
    if (pos.n===0) notes.push({k:'tip',t:'没有位置词：on the left / in the middle / in the background…'});
    if (guess.n===0) notes.push({k:'tip',t:'没有猜测语：I think… / maybe… / it looks like…'});
    const ing = toks.filter(x=>/ing$/.test(x)&&x.length>5).length; if (ing<3) notes.push({k:'tip',t:`-ing 动作词只有 ${ing} 个，描述照片要说“正在做什么”。`});
  }
  if (part==='s3'){
    if (opinion.n>=2){ score++; notes.push({k:'ok',t:`互动句型：${opinion.found.slice(0,3).join(' / ')}`}); } else if (opinion.n===1) notes.push({k:'tip',t:`互动句型只用了 1 个（${opinion.found[0]}）。加上 What about…? / I agree, but…`}); else { score--; notes.push({k:'warn',t:'没有互动句型。Part 3 评分看“会不会接话、问对方、做决定”。'}); }
    if (/\?/.test(text) || /what do you think|what about|shall we|don't you think/i.test(text)) notes.push({k:'ok',t:'向搭档提了问题 ✔'}); else notes.push({k:'tip',t:'记得把话交给搭档：What do you think?'});
    if (/choose|let's go with|the best|most useful|most important|decide/i.test(text)) notes.push({k:'ok',t:'做出了决定 ✔'}); else notes.push({k:'warn',t:'没有做决定：结尾要说 So, shall we choose…? / I think … is the best.'});
    if (linkers.n>=2) notes.push({k:'ok',t:`理由充分：${linkers.found.join(', ')}`});
  }
  score = PP.clamp(score,1,5);
  return {words,wpm,secs:Math.round(secs),fillers,score,notes,checklist,linkers:linkers.found,opinion:opinion.found};
};
SPEAK.similarity = (model, text) => { const m=new Set(PP.tokens(model)), t=new Set(PP.tokens(text)); if(!m.size) return 0; let n=0; for(const w of m) if(t.has(w)) n++; return Math.round(n/m.size*100); };
// ---------- recorder component
SPEAK.recorder = (opts={}) => {
  let rec=null, committed='', finalText='', interim='', wantRec=false, mr=null, stream=null, chunks=[], recording=false, srErr='';
  let lastBlob=null;
  const timer = PP.timerEl();
  const mic = h('button',{class:'mic', title:'开始/停止录音'},'🎙️');
  const status = h('div',{class:'small muted', style:'text-align:center;margin-top:8px'}, PP.SR ? '点击麦克风开始回答；再点一次结束' : '此浏览器不支持语音识别，可录音回放 + 手动输入');
  const trans = h('div',{class:'transcript'}, h('span',{class:'muted'},'你的回答会实时转成文字显示在这里…'));
  const manual = h('textarea',{class:'transcript', rows:'3', placeholder:'如果识别不出来，把你说的话打在这里，也能得到反馈', hidden:true});
  const manualBtn = h('button',{class:'btn btn-sm btn-ghost', on:{click:()=>{ manual.hidden=!manual.hidden; if(!manual.hidden) manual.focus(); }}},'✏️ 手动输入');
  const audio = h('audio',{controls:true, hidden:true, style:'width:100%;margin-top:10px'});
  const el = h('div',{class:'rec-panel'}, h('div',{class:'row between mb'}, h('span',{class:'pill speak'}, opts.label||'你的回答'), h('div',{class:'row gap'}, timer.el, manualBtn)), mic, status, h('div',{class:'mt'}, trans), manual, audio);
  const render = ()=>{ const full=(committed+finalText).trim(); trans.innerHTML=''; if(!full && !interim){ trans.append(h('span',{class:'muted'}, recording?'正在听…':'你的回答会实时转成文字显示在这里…')); } else { trans.append(full, ' ', h('span',{class:'interim'}, interim)); } };
  function startSR(){ if(!PP.SR) return; try{ rec=new PP.SR(); rec.lang='en-GB'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult = e=>{ let f='',it=''; for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) f+=r[0].transcript+' '; else it+=r[0].transcript; } finalText=f; interim=it; render(); };
    rec.onerror = e=>{ srErr=e.error; if(e.error==='not-allowed'||e.error==='service-not-allowed') status.textContent='❌ 麦克风权限被拒绝：请在浏览器地址栏允许麦克风后重试'; else if(e.error==='network') status.textContent='⚠️ 语音识别服务连不上（Chrome 需能访问 Google 语音服务；可试 Edge/Safari，或用“手动输入”）'; else if(e.error!=='no-speech' && e.error!=='aborted') status.textContent='识别出错：'+e.error; };
    rec.onend = ()=>{ committed += finalText; finalText=''; interim=''; if(wantRec && srErr!=='not-allowed' && srErr!=='network'){ try{ rec.start(); }catch(e){} } };
    rec.start(); }catch(e){ status.textContent='语音识别启动失败：'+e.message; } }
  async function startMR(){ try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); mr=new MediaRecorder(stream); chunks=[]; mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); }; mr.onstop=()=>{ try{ const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); lastBlob=blob; audio.src=URL.createObjectURL(blob); audio.hidden=false; }catch(e){} stream.getTracks().forEach(t=>t.stop()); }; mr.start(); }catch(e){ /* mic denied or unsupported */ } }
  const api = {
    el, get transcript(){ const t=(committed+finalText).trim(); return t || manual.value.trim(); }, get recording(){ return recording; }, get blob(){ return lastBlob; },
    start(){ if(recording) return; recording=true; wantRec=true; committed=''; finalText=''; interim=''; srErr=''; audio.hidden=true; mic.classList.add('rec'); mic.textContent='⏹'; status.textContent='正在录音… 说完再点一次结束'; render(); timer.start(opts.maxSec||0); startSR(); startMR(); opts.onStart&&opts.onStart(); },
    stop(){ if(!recording) return; recording=false; wantRec=false; mic.classList.remove('rec'); mic.textContent='🎙️'; const secs=timer.stop(); try{ rec&&rec.stop(); }catch(e){} try{ mr&&mr.state!=='inactive'&&mr.stop(); }catch(e){} committed += finalText; finalText=''; interim=''; render(); status.textContent='已结束。可以回放录音，或再录一次。'; setTimeout(()=>opts.onStop&&opts.onStop(api.transcript, secs), 350); },
    reset(){ committed=''; finalText=''; interim=''; manual.value=''; render(); audio.hidden=true; timer.el.textContent='0:00'; },
    disable(){ mic.disabled=true; }, enable(){ mic.disabled=false; },
    destroy(){ wantRec=false; try{ rec&&rec.abort(); }catch(e){} try{ mr&&mr.state!=='inactive'&&mr.stop(); }catch(e){} try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} }
  };
  mic.addEventListener('click', ()=>{ if(recording) api.stop(); else api.start(); });
  return api;
};
// ---------- feedback panel
function feedbackPanel(fb, opts={}){
  const el = h('div',{class:'card tight'});

/* PET 90 — Vocabulary flashcards with Leitner spaced repetition */
(function(){

VOCAB.dueCards = (n=10) => {
  const today=PP.today(), all=VOCAB.allCards(), srs=PP.state.srs;
  const due = all.filter(c=>srs[c.w] && srs[c.w].due<=today).sort((a,b)=>srs[a.w].due<srs[b.w].due?-1:1);
  const fresh = all.filter(c=>!srs[c.w]);

<script>
/* PET 90 — Word Shooter: canvas arcade game, one letter group per day.

(function(){
const PP=window.PP, D=window.PET_DATA, h=PP.h;
const SHOOT = PP.SHOOT = {};
SHOOT.groups = D.wordGroups;
SHOOT.MODES = { listen:{label:'🔊 先听后打', desc:'先播放单词读音，再击落它；听完后显示中文提示'}, zh2en:{label:'看中文 → 打英文', desc:'顶部显示中文，击落对应英文'}, en2zh:{label:'看英文 → 打中文', desc:'顶部显示并朗读英文，击落中文意思'} };

  function roundRect(x,y,w,hh,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+hh,r); ctx.arcTo(x+w,y+hh,x,y+hh,r); ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font="800 12px Nunito, 'PingFang SC', sans-serif";
    const modeText = mode==='listen' ? '听读音，击落这个单词' : mode==='zh2en' ? '击落这个意思的英文单词' : '击落这个单词的中文意思';

    let prompt='', dim=false;
    if(mode==='zh2en') prompt=target?target.zh:'';
    else if(mode==='en2zh') prompt=target?target.w:'';
    else { if(hintShown) prompt=target?target.zh:''; else { prompt='正在朗读…'; dim=true; } }
    // speaker icon (clickable)
    const sx=18, sy=50;
    if(mode!=='zh2en'){ ctx.fillStyle=speaking?'#ffd166':'rgba(255,255,255,.75)'; ctx.font="26px system-ui, 'Apple Color Emoji', sans-serif"; ctx.fillText('🔊', sx, sy); if(speaking){ const k=Math.floor(speakT*6)%3; ctx.strokeStyle='rgba(255,209,102,.7)'; ctx.lineWidth=2; for(let i=0;i<=k;i++){ ctx.beginPath(); ctx.arc(sx+18, sy, 20+i*8, -0.6, 0.6); ctx.stroke(); } } }
    const px = mode!=='zh2en' ? sx+64 : 18; const pw = prompt ? textW(prompt, FONT_ZH) : 0;

    if(mode!=='zh2en'){ ctx.fillStyle='rgba(255,255,255,.45)'; ctx.font="700 12px Nunito, 'PingFang SC', sans-serif"; ctx.fillText('空格键 / 点喇叭 = 再听一遍', px + pw + 18, sy+1); }

    ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font="900 22px Nunito, sans-serif"; ctx.fillText(String(score), W-18, 24);
    ctx.font="800 12px Nunito, 'PingFang SC', sans-serif"; ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillText('得分', W-18-textW(String(score),"900 22px Nunito, sans-serif")-8, 24);
    let hearts=''; for(let i=0;i<3;i++) hearts += i<lives?'❤️':'🖤'; ctx.font="18px system-ui, 'Apple Color Emoji', sans-serif"; ctx.fillText(hearts, W-18, 54);
    ctx.font="800 14px Nunito, 'PingFang SC', sans-serif"; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillText(`${hits}/${queue.length}  ·  Lv ${level}  ·  ${speedMult.toFixed(1)}x${combo>1?'  ·  连击 ×'+combo:''}`, W-90, 54);

    ctx.save(); ctx.translate(shipX,shipY); ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(18,14); ctx.lineTo(0,6); ctx.lineTo(-18,14); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.moveTo(-7,12); ctx.lineTo(0,26+Math.random()*8); ctx.lineTo(7,12); ctx.closePath(); ctx.fill(); ctx.restore();

const META = p => isL(p) ? LM()[p] : PM()[p];
const SETOF = (p,id) => isL(p) ? PP.LISTEN.getSet(p,id) : PP.READ.getSet(p,id);
const RUNOF = (p,id,back) => isL(p) ? PP.LISTEN.run({part:p, setId:id, mode:'review', back}) : PP.READ.run({part:p, setId:id, mode:'review', back});

// ---------- 把一道错题还原成可展示的内容
H.questionOf = (part, setId, i) => {
  const set = SETOF(part, setId); if(!set) return null;
  const T = t => ({title:set.title||META(part).zh, part, setId, index:i, ...t});
  const LT='ABC';
  if (part==='l1'){ const it=set.items[i]; if(!it) return null; return T({q:it.q, body:'', options:it.options.map((o,k)=>LT[k]+'. '+o.emoji+' '+o.label), correct:LT[it.answer], why:it.why, script:it.script, audio:true}); }
  if (part==='l2'){ const it=set.items[i]; if(!it) return null; return T({q:it.q, body:'🔈 '+it.intro, options:it.options.map((o,k)=>LT[k]+'. '+o), correct:LT[it.answer], why:it.why, script:it.script, intro:it.intro, audio:true}); }
  if (part==='l3'){ const g=set.gaps[i]; if(!g) return null; const ln=set.lines.find(l=>l.gap===i);
    return T({q:`笔记空 [${i+1}]　${ln?ln.label:''}`, body:'🔈 '+set.intro, options:null, correct:g.answer[0], why:g.why, script:set.script, intro:set.intro, audio:true}); }
  if (part==='l4'){ const q=set.questions[i]; if(!q) return null; return T({q:q.q, body:'🔈 '+set.intro, options:q.options.map((o,k)=>LT[k]+'. '+o), correct:LT[q.answer], why:q.why, script:set.script, intro:set.intro, audio:true}); }
  if (part==='p1'){ const it=set.items[i]; if(!it) return null; return T({q:it.heading, body:it.text, options:it.options.map((o,k)=>LET[k]+'. '+o), correct:LET[it.answer], why:it.why}); }
  if (part==='p2'){ const p=set.people[i]; if(!p) return null; const a=set.answers[i]; const txt=set.texts.find(t=>t.letter===a);
    return T({q:`把「${p.name}」配到哪一段？`, body:p.text, options:set.texts.map(t=>t.letter+'. '+t.title), correct:a, why:set.why[i], extra:txt?`${a}. ${txt.title}：${txt.body}`:''}); }
  if (part==='p3'){ const q=set.questions[i]; if(!q) return null; return T({q:q.q, body:'', options:q.options.map((o,k)=>LET[k]+'. '+o), correct:LET[q.answer], why:q.why}); }
  if (part==='p4'){ const a=set.answers[i]; return T({q:`空 [${i+1}] 应该填哪一句？`, body:'', options:set.sentences.map((x,k)=>LET[k]+'. '+x), correct:a, why:set.why[i]}); }
  if (part==='p5'){ const g=set.gaps[i]; if(!g) return null; return T({q:`空 [${i+1}]`, body:'', options:g.options.map((o,k)=>LET[k]+'. '+o), correct:LET[g.answer], why:g.why}); }
  if (part==='p6'){ const acc=set.answers[i]; if(!acc) return null; return T({q:`空 [${i+1}]（填一个词）`, body:'', options:null, correct:acc.join(' / '), why:set.why[i]}); }
  return null;
};
H.chosenLabel = (part, rec, i) => {
  if (!rec.answers) return null;
  const a = rec.answers[i]; if (a==='' || a===null || a===undefined) return '（没作答）';
  if (part==='p2' || part==='p4') return String(a);
  if (part==='p6' || part==='l3') return String(a);
  return LET[a] !== undefined ? LET[a] : String(a);
};
// ---------- 错题本：跨所有练习收集，去重取最近一次
H.wrongList = () => {
  const map = new Map();
  for (const r of PP.state.results){
    if (!r.wrong || !r.wrong.length) continue;
    for (const i of r.wrong){
      const key = `${r.part}|${r.setId}|${i}`;
      const prev = map.get(key);
      if (!prev || r.ts > prev.ts) map.set(key, {key, part:r.part, setId:r.setId, index:i, ts:r.ts, day:r.day, rec:r, times:(prev?prev.times:0)+1});
      else prev.times++;
    }
  }
  const out = [];
  for (const v of map.values()){
    const q = H.questionOf(v.part, v.setId, v.index); if(!q) continue;
    const fixedAt = PP.state.fixed[v.key];
    out.push(Object.assign(v, {q, fixed: !!fixedAt, fixedAt}));
  }
  return out.sort((a,b)=>b.ts-a.ts);
};
H.stats = () => {
  const w = H.wrongList();
  const byPart = {};
  for (const x of w){ byPart[x.part] = byPart[x.part] || {total:0, open:0}; byPart[x.part].total++; if(!x.fixed) byPart[x.part].open++; }
  return {total:w.length, open:w.filter(x=>!x.fixed).length, byPart};
};

// ---------- 页面
PP.pages.history = (c, params={}) => {
  const tab = params.tab || 'wrong';
  const tabs = [['wrong','📕 错题本'],['audio','🎧 口语录音'],['log','🗓️ 学习日志']];
  c.append(PP.pageHead('记录', '做过的每一题、说过的每一段，都存在这里。数据只在这台设备上。',
    h('div',{class:'seg'}, ...tabs.map(([k,l])=>h('button',{class:k===tab?'on':'', on:{click:()=>PP.navigate('history',{tab:k})}}, l)))));
  if (tab==='wrong') return wrongBook(c);
  if (tab==='audio') return audioBook(c);
  return logBook(c);
};

function wrongBook(c){
  const list = H.wrongList(), st = H.stats();
  if (!list.length){ c.append(h('div',{class:'card'}, PP.say('还没有错题——要么是还没开始练，要么是全对了！先去做一组阅读吧。','happy',80), h('div',{class:'row gap mt'}, h('button',{class:'btn btn-read', on:{click:()=>PP.navigate('reading')}},'去练阅读')))); return; }
  c.append(h('div',{class:'grid4 mb'},
    h('div',{class:'stat'}, h('div',{class:'v'}, st.total), h('div',{class:'k'},'错过的题（去重后）')),
    h('div',{class:'stat'}, h('div',{class:'v', style:'color:var(--red)'}, st.open), h('div',{class:'k'},'还没订正')),
    h('div',{class:'stat'}, h('div',{class:'v', style:'color:var(--green)'}, st.total-st.open), h('div',{class:'k'},'已订正')),
    h('div',{class:'stat'}, h('div',{class:'v'}, Object.keys(st.byPart).length?Object.entries(st.byPart).sort((a,b)=>b[1].open-a[1].open)[0][0].toUpperCase():'—'), h('div',{class:'k'},'最弱的部分'))));
  const parts = Object.keys(st.byPart);
  let filter='open', partFilter='';
  const bar = h('div',{class:'row between wrap gap mb'});
  const body = h('div');
  const segF = h('div',{class:'seg'}, ...[['open','只看没订正'],['all','全部'],['fixed','已订正']].map(([k,l])=>h('button',{class:k==='open'?'on':'', on:{click:e=>{ filter=k; segF.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); render(); }}}, l)));
  const segP = h('div',{class:'seg'}, h('button',{class:'on', on:{click:e=>{ partFilter=''; segP.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); render(); }}},'全部题型'),
    ...parts.map(p=>h('button',{on:{click:e=>{ partFilter=p; segP.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); render(); }}}, (isL(p)?'听力':'阅读')+META(p).name.replace('Part ','P'))));
  bar.append(h('div',{class:'row gap wrap'}, segF, segP), h('button',{class:'btn btn-read', on:{click:()=>retryWorst()}},'🔁 重做最弱的一组'));
  c.append(bar, body);
  function retryWorst(){
    const open = list.filter(x=>!x.fixed); if(!open.length){ PP.toast('没有待订正的错题 🎉'); return; }
    const count={}; for(const x of open) count[`${x.part}|${x.setId}`]=(count[`${x.part}|${x.setId}`]||0)+1;
    const [k] = Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
    const [part,setId]=k.split('|');
    RUNOF(part, setId, {page:'history',params:{tab:'wrong'}});
  }
  function render(){
    body.innerHTML='';
    let rows = list.filter(x=> filter==='all' ? true : filter==='fixed' ? x.fixed : !x.fixed);
    if (partFilter) rows = rows.filter(x=>x.part===partFilter);
    if (!rows.length){ body.append(h('div',{class:'empty'},'这个筛选下没有题目')); return; }
    for (const x of rows){
      const q=x.q, chosen=H.chosenLabel(x.part, x.rec, x.index);
      const card=h('div',{class:'card tight', style:x.fixed?'border-color:var(--green-l);background:var(--green-xl)':''});
      card.append(h('div',{class:'row between wrap gap mb'},
        h('div',{class:'row gap wrap'}, h('span',{class:isL(x.part)?'pill listen':'pill read'}, (isL(x.part)?'听力 ':'阅读 ')+META(x.part).name+' '+META(x.part).zh), h('span',{class:'pill'}, q.title), x.times>1?h('span',{class:'pill bad'}, `错了 ${x.times} 次`):null, x.fixed?h('span',{class:'pill ok'},'✓ 已订正'):h('span',{class:'pill warn'},'待订正')),
        h('span',{class:'small muted'}, new Date(x.ts).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}) + (x.day?` · Day ${x.day}`:''))));
      card.append(h('div',{class:'bold mb'}, q.q));
      if (q.body) card.append(h('div',{class:'rw notice', style:'margin-bottom:10px'}, q.body));
      if (q.options){ const box=h('div',{style:'margin-bottom:8px'}); q.options.forEach(o=>{ const L=o.slice(0,1); const isC=L===q.correct||q.correct.indexOf(L)===0; const isX=chosen && L===chosen.slice(0,1) && !isC; box.append(h('div',{class:'opt'+(isC?' correct':isX?' wrong':''), style:'cursor:default;margin-bottom:4px'}, h('span',{}, o), isC?h('span',{class:'pill ok', style:'margin-left:auto'},'正确'):isX?h('span',{class:'pill bad', style:'margin-left:auto'},'你选的'):null)); }); card.append(box); }
      else card.append(h('div',{class:'row gap mb'}, h('span',{class:'pill ok'}, '正确答案：'+q.correct), chosen?h('span',{class:'pill bad'}, '你填的：'+chosen):null));
      card.append(h('div',{class:'why'}, h('b',{},'为什么　'), q.why||''));
      if (q.script){ const pl=PP.LISTEN.player({script:q.script, intro:q.intro, compact:true}); card.append(h('div',{class:'row gap mt'}, h('span',{class:'small muted'},'再听一遍：'), pl.el)); card.append(h('details',{class:'script-box'}, h('summary',{},'📄 听力原文'), h('div',{class:'script-body'}, ...(q.intro?[h('p',{class:'nar'},q.intro)]:[]), ...q.script.map(l=>h('p',{}, h('b',{class:'sp sp-'+l.sp}, l.sp==='F'?'女':l.sp==='M'?'男':'旁白'), l.t))))); }
      const notes = PP.state.notes[x.key]||'';
      const ta = h('textarea',{class:'transcript', rows:'2', placeholder:'写点笔记（比如：又掉进"条件当事实"的坑）', style:'margin-top:10px'}); ta.value=notes;
      ta.addEventListener('change',()=>{ if(ta.value.trim()) PP.state.notes[x.key]=ta.value.trim(); else delete PP.state.notes[x.key]; PP.save(); PP.toast('笔记已保存'); });
      card.append(ta);
      card.append(h('div',{class:'row gap mt'},
        h('button',{class:'btn btn-sm '+(isL(x.part)?'btn-listen':'btn-read'), on:{click:()=>RUNOF(x.part, x.setId, {page:'history',params:{tab:'wrong'}})}}, isL(x.part)?'重听这一组':'重做这一组'),
        h('button',{class:'btn btn-sm', on:{click:()=>{ PP.state.fixed[x.key]=x.fixed?0:Date.now(); PP.save(); PP.navigate('history',{tab:'wrong'}); }}}, x.fixed?'标为待订正':'✓ 标为已订正'),
        h('button',{class:'btn btn-sm btn-ghost', on:{click:()=>PP.navigate('lessons',{id:META(x.part).lesson})}},'📚 看方法')));
      body.append(card);
    }
  }
  render();
}

function audioBook(c){
  const box=h('div'); c.append(box);
  box.append(h('div',{class:'empty'},'读取录音中…'));
  PP.audio.list().then(clips=>{
    box.innerHTML='';
    const sessions = PP.state.speaking.slice().reverse();
    const byId = {}; for(const cl of clips) byId[cl.id]=cl;
    const withAudio = sessions.filter(s=>s.audioId&&byId[s.audioId] || (s.audioIds||[]).some(i=>byId[i]));
    box.append(h('div',{class:'grid4 mb'},
      h('div',{class:'stat'}, h('div',{class:'v'}, sessions.length), h('div',{class:'k'},'口语练习段数')),
      h('div',{class:'stat'}, h('div',{class:'v'}, clips.length), h('div',{class:'k'},'存下的录音')),
      h('div',{class:'stat'}, h('div',{class:'v'}, PP.fmtTime(sessions.reduce((a,s)=>a+s.secs,0))), h('div',{class:'k'},'累计开口时长')),
      h('div',{class:'stat'}, h('div',{class:'v'}, (clips.reduce((a,x)=>a+((x.blob&&x.blob.size)||0),0)/1048576).toFixed(1)+'M'), h('div',{class:'k'},'录音占用空间'))));
    if (!sessions.length){ box.append(h('div',{class:'card'}, PP.say('还没有口语记录。去练一次，录音会自动存下来，之后可以回听。','happy',80), h('button',{class:'btn btn-speak mt', on:{click:()=>PP.navigate('speaking')}},'去练口语'))); return; }
    box.append(h('div',{class:'instr'}, '💡 录音只保存最近 80 段，超出会自动删掉最旧的。录音存在浏览器/App 的本地数据库里，导出备份**不含**录音。'));
    for (const s of sessions.slice(0,60)){
      const m=SM()[s.part]; const ids=(s.audioIds&&s.audioIds.length)?s.audioIds:(s.audioId?[s.audioId]:[]);
      const avail=ids.filter(i=>byId[i]);
      const card=h('div',{class:'card tight'});
      card.append(h('div',{class:'row between wrap gap mb'},
        h('div',{class:'row gap wrap'}, h('span',{class:'pill speak'}, m.name+' '+m.zh), h('span',{class:'pill'}, `${s.words} 词 · ${s.secs}s`), h('span',{class:'pill '+(s.score>=4?'ok':s.score>=3?'warn':'bad')}, `估分 ${s.score}/5`), s.self?h('span',{class:'small'},'⭐'.repeat(s.self)):null),
        h('span',{class:'small muted'}, new Date(s.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) + (s.day?` · Day ${s.day}`:''))));
      const label = titleFor(s);
      if (label) card.append(h('div',{class:'bold mb'}, label));
      card.append(h('div',{class:'transcript'}, s.transcript||'（没有识别到文字）'));
      if (avail.length){
        const row=h('div',{class:'row gap wrap mt'});
        avail.forEach((id,k)=>{ const a=h('audio',{controls:true, style:'height:34px;max-width:100%'}); a.src=URL.createObjectURL(byId[id].blob); row.append(avail.length>1?h('div',{class:'row gap'}, h('span',{class:'pill'},`第${k+1}回合`), a):a); });
        card.append(row);
      } else card.append(h('div',{class:'small muted mt'}, ids.length?'（录音已被清理）':'（这次没有存下录音）'));
      const md = modelFor(s);
      if (md) card.append(h('div',{class:'row gap mt'}, h('button',{class:'btn btn-sm', on:{click:()=>PP.speak(md)}},'🔊 听范例'), h('button',{class:'btn btn-sm btn-ghost', on:{click:()=>{ const p=h('div',{class:'bubble mt'}, md); card.append(p); }}},'看范例文字')));
      box.append(card);
    }
  });
  function titleFor(s){
    if (s.part==='s1'){ const q=D.speaking_p1.find(x=>x.id===s.itemId); return q?q.q:''; }
    if (s.part==='s2'){ const p=D.speaking_p2.find(x=>x.id===s.itemId); return p?`描述照片：${p.scene}`:''; }
    if (s.part==='s3'){ const x=D.speaking_p3.find(x=>x.id===s.itemId); return x?`讨论：${x.theme}`:''; }
    if (s.part==='s4'){ const base=String(s.itemId).replace(/-\d+$/,''); const set=D.speaking_p4.find(x=>x.id===base); const k=+String(s.itemId).split('-').pop(); return set&&set.questions[k]?set.questions[k].q:''; }
    return '';
  }
  function modelFor(s){
    if (s.part==='s1'){ const q=D.speaking_p1.find(x=>x.id===s.itemId); return q&&q.model; }
    if (s.part==='s2'){ const p=D.speaking_p2.find(x=>x.id===s.itemId); return p&&p.model; }
    if (s.part==='s3'){ const x=D.speaking_p3.find(x=>x.id===s.itemId); return x&&x.model; }
    if (s.part==='s4'){ const base=String(s.itemId).replace(/-\d+$/,''); const set=D.speaking_p4.find(x=>x.id===base); const k=+String(s.itemId).split('-').pop(); return set&&set.questions[k]&&set.questions[k].model; }
    return null;
  }
}

function logBook(c){
  const days = {};
  const push=(d,item)=>{ (days[d]=days[d]||[]).push(item); };
  const dkey = ts => { const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  for (const r of PP.state.results){ const set=SETOF(r.part,r.setId);
    if (isL(r.part)){ push(dkey(r.ts), {ts:r.ts, kind:'listening', icon:'🎧', cls:'listen', title:`听力 ${META(r.part).name} · ${set?set.title:r.setId}`, right:`${r.score}/${r.total}`, ok:r.score/r.total>=0.7, sub:`${Math.round(r.score/r.total*100)}%${r.mode==='review'?' · 复盘':''}`}); continue; }
    push(dkey(r.ts), {ts:r.ts, kind:'reading', icon:'📖', cls:'read', title:`阅读 ${PM()[r.part].name} · ${set?set.title||PM()[r.part].zh:r.setId}`, right:`${r.score}/${r.total}`, ok:r.score/r.total>=0.7, sub:`${Math.round(r.score/r.total*100)}%${r.secs?' · '+PP.fmtTime(r.secs):''}${r.mode==='mock'?' · 模考':r.mode==='review'?' · 复盘':''}`}); }
  for (const s of PP.state.speaking){ const m=SM()[s.part]; push(dkey(s.ts), {ts:s.ts, kind:'speaking', icon:'🎙️', cls:'speak', title:`口语 ${m.name} · ${m.zh}`, right:`${s.score}/5`, ok:s.score>=3, sub:`${s.words} 词 · ${s.secs}s${s.audioId||((s.audioIds||[]).length)?' · 🎧 有录音':''}`}); }
  for (const g of PP.state.shoot){ push(dkey(g.ts), {ts:g.ts, kind:'shoot', icon:'🚀', cls:'shoot', title:`单词射击 · 字母 ${g.group}`, right:`${g.score} 分`, ok:g.acc>=70, sub:`命中 ${g.hits} · 准确率 ${g.acc}%${(g.missed||[]).length?' · 漏 '+g.missed.length+' 词':''}`}); }
  for (const m of PP.state.mocks){ push(dkey(m.ts), {ts:m.ts, kind:'mock', icon:'🏆', cls:'mock', title: m.type==='reading'?'阅读全卷模考':'口语完整模拟', right: m.type==='reading'?`${m.score}/${m.total}`:`${m.avg}/5`, ok:true, sub: m.type==='reading'?`${m.pct}% · ${PP.MOCK.estimate(m.pct).band}`:`${m.n} 段 · ${m.words} 词`}); }
  const keys = Object.keys(days).sort().reverse();
  const totalItems = keys.reduce((a,k)=>a+days[k].length,0);
  c.append(h('div',{class:'grid4 mb'},
    h('div',{class:'stat'}, h('div',{class:'v'}, keys.length), h('div',{class:'k'},'练习过的天数')),
    h('div',{class:'stat'}, h('div',{class:'v'}, totalItems), h('div',{class:'k'},'累计完成的项目')),
    h('div',{class:'stat'}, h('div',{class:'v'}, PP.streak()+' 🔥'), h('div',{class:'k'},'当前连续天数')),
    h('div',{class:'stat'}, h('div',{class:'v'}, PP.state.xp), h('div',{class:'k'},'累计 XP'))));
  if (!keys.length){ c.append(h('div',{class:'card'}, PP.say('日志还是空的。做完今天的任务，这里就会有记录了。','happy',80), h('button',{class:'btn btn-primary mt', on:{click:()=>PP.navigate('today')}},'去做今日任务'))); return; }
  const start=PP.state.profile.start;
  for (const k of keys){
    const items=days[k].sort((a,b)=>b.ts-a.ts);
    const dayNo = start ? PP.daysBetween(start,k)+1 : null;
    const box=h('div',{class:'card tight'});
    box.append(h('div',{class:'row between wrap gap mb'}, h('h3',{}, PP.fmtDate(k), dayNo&&dayNo>=1?h('span',{class:'pill', style:'margin-left:8px'}, `Day ${dayNo}`):null), h('span',{class:'small muted'}, `${items.length} 项`)));
    const list=h('div',{class:'set-list'});
    for (const it of items){
      list.append(h('div',{class:'set-row', style:'cursor:default'},
        h('span',{class:'task-ic ic '+it.cls, style:'width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:var(--'+({read:'blue',listen:'purple',speak:'orange',shoot:'green',mock:'red'}[it.cls]||'blue')+'-l)'}, it.icon),
        h('span',{class:'t'}, it.title, h('div',{class:'small muted', style:'font-weight:600'}, it.sub)),
        h('span',{class:'score '+(it.ok?'good':'bad')}, it.right),
        h('span',{class:'small muted'}, new Date(it.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}))));
    }
    box.append(list); c.append(box);
  }
}
})();

</script>
<script>
/* PET 90 — Progress page: KPIs, accuracy by part, shooter bests, 90-day strip, history, export/import */
(function(){
const PP=window.PP, h=PP.h;
function bars(items, opts={}){

    const W=PP.PLAN.WEEKS[w-1]; const nd=w===13?6:7;
    const pcolor = W.phase==='基础'?'var(--green)':W.phase==='提升'?'var(--blue)':'var(--purple)';
    units.append(h('div',{class:'unit-banner phase-'+W.phase}, h('div',{}, h('h3',{}, `第 ${w} 关 · ${W.phase}${w===13?' · 考前 6 天':''}`), h('div',{class:'sub'}, `阅读 ${W.r.map(p=>PM[p].zh).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')} · 口语 ${W.s.map(p=>SM[p].zh).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')}${W.phase==='冲刺'?' · 周六阅读模考 · 周日口语模拟':''}`)), h('span',{style:'font-size:34px'}, W.phase==='基础'?'🌱':W.phase==='提升'?'🚀':'🏆')));
    const path=h('div',{class:'path'});
    for (let d=1; d<=nd; d++){
      const day=(w-1)*7+d; const {plan,tasks,done,total}=PP.PLAN.dayProgress(day);
      const state = done>=total?'done':done>0?'part':day<=ti?'open':'future';
      const off = (w%2? OFF[d-1] : -OFF[d-1]);
      const label = state==='done' ? '👑' : plan.readingMock ? '📖' : plan.speakingMock ? '🎙️' : plan.review ? '🔁' : `Day ${day}`;
      const node=h('div',{class:`node ${state}${day===ti?' today':''}`, style:`--x:${off}px;--p-color:${pcolor}`, title:`Day ${day}：${tasks.map(t=>t.label).join('｜')}`, on:{click:()=>PP.navigate('today',{day})}},
        day===ti&&state!=='done'?h('div',{class:'node-tip'}, done>0?'继续！':'开始！'):null,
        h('div',{class:'node-btn', style:state==='open'?`background:${pcolor}`:''}, label),
        done>0&&state!=='done'?h('span',{class:'mini'}, `${done}/${total}`):null,
        h('div',{class:'node-date'}, (start?PP.fmtDate(PP.addDays(start,day-1)):`Day ${day}`) + (plan.readingMock?' 模考':plan.speakingMock?' 口语模拟':plan.review?' 复盘':'')));
      if (day===ti) todayNode=node;
      path.append(node);
    }
    units.append(path);
  }
  c.append(units);
  if (todayNode) setTimeout(()=>todayNode.scrollIntoView({behavior:'smooth', block:'center'}), 50);
};
PP.pages.lessons = (c, params={}) => {
  if (params.id){
    const L=D.lessons.find(l=>l.id===params.id); if(!L) return PP.navigate('lessons');
    const back=params.day?{page:'today',params:{day:params.day}}:{page:'lessons',params:{}};
    c.append(PP.pageHead(L.title, `约 ${L.minutes} 分钟阅读`, h('button',{class:'btn btn-ghost', on:{click:()=>PP.navigate(back.page, back.params)}},'← 返回')));
    const body=h('div',{class:'card lesson-body'}); L.sections.forEach(s=>{ body.append(h('h2',{},s.h), h('div',{html:s.html})); }); c.append(body);
    const btn=h('button',{class:'btn btn-primary btn-lg', on:{click:()=>{ if(!PP.state.lessonsRead[L.id]){ PP.state.lessonsRead[L.id]=PP.today(); PP.save(); PP.addXP(10,'读完教程'); } if(params.taskKey) PP.completeTask(params.day, params.taskKey); else PP.navigate('lessons'); }}}, params.taskKey?'✓ 我读完了，返回今日':'✓ 我读完了');
    const practice = L.part && L.part.startsWith('p') ? h('button',{class:'btn btn-read btn-lg', on:{click:()=>PP.navigate('reading',{part:L.part})}},'去练这部分 →') : L.part && L.part.startsWith('s') ? h('button',{class:'btn btn-speak btn-lg', on:{click:()=>PP.navigate('speaking',{part:L.part})}},'去练这部分 →') : null;
    c.append(h('div',{class:'row gap'}, btn, practice));
    return;
  }
  c.append(PP.pageHead('教程', '13 节方法课。学习地图会在每个题型第一次出现的当天安排对应的课；也可以随时回来看。'));
  const list=h('div',{class:'set-list lesson-list'});
  D.lessons.forEach((L,i)=>{ const read=PP.state.lessonsRead[L.id]; list.append(h('div',{class:'set-row', on:{click:()=>PP.navigate('lessons',{id:L.id})}}, h('span',{class:'qn'}, i), h('span',{class:'t'}, L.title, h('small',{}, `约 ${L.minutes} 分钟${read?' · 已读 '+read:''}`)), h('span',{class:'pill '+(read?'ok':'')}, read?'已读':'未读'), h('span',{class:'btn btn-sm'},'打开'))); });
  c.append(list);
};
PP.pages.settings = (c) => {

  const name=h('input',{type:'text', value:p.name, placeholder:'例如：小明'}), start=h('input',{type:'date', value:p.start||PP.today()}), exam=h('input',{type:'date', value:p.examDate||''});
  const target=h('select',{}, ...[[140,'140 · 通过（Pass, B1）'],[153,'153 · 良好（Merit）'],[160,'160 · 优秀（Distinction, 发 B2 证书）']].map(([v,l])=>h('option',{value:v, selected:+p.target===v},l)));

    h('div',{class:'card'}, h('h3',{class:'mb'},'学习者'), h('div',{class:'field'}, h('label',{},'名字'), name), h('div',{class:'field'}, h('label',{},'计划开始日期（Day 1）'), start), h('div',{class:'field'}, h('label',{},'目标分数'), target), h('div',{class:'field'}, h('label',{},'考试日期（可选，用于倒计时）'), exam), h('button',{class:'btn btn-primary', on:{click:()=>{ p.name=name.value.trim(); p.start=start.value; p.target=+target.value; p.examDate=exam.value; p.voice=voice.value; PP.save(); PP.renderSidebar(); PP.toast('已保存'); }}},'保存')),
    h('div',{class:'card'}, h('h3',{class:'mb'},'声音与麦克风'), h('div',{class:'field'}, h('label',{},'考官/范例朗读声音'), voice), h('div',{class:'row gap wrap mb'}, h('button',{class:'btn', on:{click:()=>{ p.voice=voice.value; PP.speak("Hello! My name is your examiner. Tell me something about your family."); }}},'🔊 试听'), h('button',{class:'btn', on:{click:async()=>{ micOut.textContent='请求麦克风…'; try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); micOut.textContent='✅ 麦克风可用'; }catch(e){ micOut.textContent='❌ 麦克风不可用：'+e.message; } }}},'🎤 测试麦克风'), micOut),
      h('div',{class:'why'}, h('b',{},'语音识别说明：'), '口语转文字使用浏览器内置识别。Chrome 需要能访问 Google 语音服务（国内需代理）；Edge / Safari 使用各自的服务。识别不可用时，仍可录音回放，并用“手动输入”获得反馈。', h('br'), '当前浏览器：', PP.SR?'✅ 支持语音识别':'❌ 不支持语音识别'))));
  const ver=(()=>{ try{ return (document.querySelector('script[src*="app.js"]').getAttribute('src').match(/v=([0-9a-z]+)/)||[])[1]||'dev'; }catch(e){ return 'dev'; } })();
  const credits=h('div',{class:'card'}, h('h3',{class:'mb'},'关于 & 照片版权'), h('p',{class:'small muted'}, `构建版本：${ver} · 数据保存在本浏览器 localStorage，换设备请用「成绩 → 导出备份」`), h('p',{class:'small muted'},'PET 90 是一个本地运行的备考练习工具，题目为原创仿真题，不是剑桥官方真题。口语 Part 2 照片来自 Wikimedia Commons，作者与许可如下：'), h('ul',{class:'small'}, ...D.speaking_p2.map(ph=>h('li',{}, h('a',{href:ph.page, target:'_blank', rel:'noopener'}, ph.scene), ` — ${ph.by||''} · ${ph.license}`))));

function onboarding(){
  const name=h('input',{type:'text', placeholder:'孩子的名字（可不填）'}), start=h('input',{type:'date', value:PP.today()}), exam=h('input',{type:'date'});

  const micOut=h('div',{class:'small muted', style:'margin-top:6px'});
  const box=h('div',{},
    PP.say('嗨！我是 Peti。90 天，每天 25 分钟：1 组阅读 + 1 个口语任务 + 10 张单词卡 + 1 局单词射击。准备好了吗？','cheer',88),

    h('div',{class:'row gap wrap'}, h('button',{class:'btn btn-primary btn-lg', on:{click:()=>{ const p=PP.state.profile; p.name=name.value.trim(); p.start=start.value||PP.today(); p.target=+target.value; p.examDate=exam.value; PP.save(); PP.closeModal(); PP.renderSidebar(); PP.navigate('today'); }}},'开始 90 天 →'), h('button',{class:'btn', on:{click:async()=>{ micOut.textContent='请求麦克风…'; try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); micOut.textContent='✅ 麦克风可用（口语练习需要）'; }catch(e){ micOut.textContent='❌ 麦克风不可用：'+e.message+'（口语仍可手动输入）'; } }}},'🎤 先测一下麦克风')), micOut);
  PP.modal(box, {title:'欢迎来到 PET 90', noClose:true});
}
function boot(){
  PP.renderSidebar();
  const hash=(location.hash||'').replace('#','');
  PP.navigate(PP.pages[hash]?hash:'today');
  if (!PP.state.profile.start) onboarding();
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
